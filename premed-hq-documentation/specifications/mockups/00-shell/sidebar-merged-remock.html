<!--
  STATUS: APPROVED — compact merged desktop sidebar with hover-triggered fade
  VISUAL AUTHORITY: This mockup settles sidebar layout, density, alignment,
  typography, icon treatment, spacing, and hover-triggered fade motion. Behavioral/product requirements
  remain governed by specifications/00-product-shell.md.

  DECISIONS THIS FILE ENCODES
  - A compact desktop sidebar; no collapsed rail and no width/slide peek.
  - Icons and titles use one shared navigation-row model with a 10–12px gap.
  - No vertical divider or logo tile; mark and wordmark sit directly on the surface.
  - Header and account are pinned; navigation starts with a deliberate top inset, never scrolls,
    and rows—not uneven section gaps—absorb available vertical space.
  - Groups use small labels and short rules rather than full-width separators.
  - The left-edge zone or top-left control fades the full sidebar in/out above the page with
    opacity only. No content push, transform, layout, or width motion.

  DELIBERATELY EXCLUDED
  - Width animation, an independently moving icon rail, and duplicate
    icon/label navigation lists. They were rejected because they introduced alignment
    drift, unstable motion, and a sidebar that felt too wide. The left edge is only a trigger;
    it does not reveal a partial sidebar.
-->
