<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Premed OS mockup variant lab</title>
<script>
/*
  Variant injection needs a shared local origin. Opening this file directly gives
  the parent and its iframe opaque file:// origins, so switching can silently fail.
*/
if(location.protocol==="file:"){
  const supportedUrl=new URL("/variant-lab.html","http://localhost:8765");
  supportedUrl.search=location.search;
  supportedUrl.hash=location.hash;
  location.replace(supportedUrl.href);
}
</script>
<!--
  PROTOTYPE REVIEW LAB — never an implementation reference.

  Loads every user-facing HTML mockup without modifying the approved original.
  A = the original composition.
  B/C = page-specific structural experiments injected into the same source.
  Existing native prototypes keep their own fully-authored A/B/C variants.

  Shareable URL: ?page=<page-id>&variant=A|B|C
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#171512;--panel:#211e1a;--card:#2b2722;--muted:#322e28;--bd:#3c352d;
  --fg:#ece3d4;--mut:#a89c8c;--dim:#7c7264;--cat:#4b9cd3;--ok:#6fc0a8;
  --warn:#e7b06a;--legacy:#c98ac9;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Nunito',system-ui,sans-serif;overflow:hidden}
button{font:inherit}
.lab{height:100%;display:grid;grid-template-columns:270px minmax(0,1fr)}
.side{background:var(--panel);border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
.brand{padding:17px 17px 14px;border-bottom:1px solid var(--bd)}
.brand h1{font-family:'Baloo 2';font-size:19px;line-height:1;margin:0;font-weight:800}
.brand p{font-size:10.5px;color:var(--dim);font-weight:700;margin:5px 0 0}
.progress{margin-top:11px;height:5px;background:#141210;border-radius:999px;overflow:hidden}
.progress i{height:100%;display:block;background:var(--cat);width:100%;box-shadow:0 0 10px color-mix(in srgb,var(--cat) 55%,transparent)}
.nav{padding:10px;overflow:auto;display:flex;flex-direction:column;gap:3px}
.group{font-family:'Baloo 2';font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:800;padding:10px 8px 4px}
.subgroup{font-family:'Baloo 2';font-size:9px;color:#c4b9aa;font-weight:800;padding:7px 8px 2px 17px}
.pagebtn{width:100%;border:1px solid transparent;background:transparent;color:var(--mut);border-radius:9px;padding:8px 9px;
  display:grid;grid-template-columns:1fr auto;gap:7px;text-align:left;cursor:pointer}
.pagebtn.depth1{padding-left:18px}.pagebtn.depth2{padding-left:29px}
.pagebtn:hover{background:var(--muted);color:var(--fg)}
.pagebtn.on{background:color-mix(in srgb,var(--cat) 12%,var(--muted));border-color:color-mix(in srgb,var(--cat) 35%,var(--bd));color:var(--fg)}
.pname{display:block;font-family:'Baloo 2';font-size:11.5px;font-weight:800;line-height:1.2}
.pmeta{display:block;font-size:8.5px;color:var(--dim);font-weight:700;margin-top:2px}
.status{align-self:center;font-family:'Baloo 2';font-size:7.5px;font-weight:800;border-radius:999px;padding:2px 6px;
  background:#171512;color:var(--dim);text-transform:uppercase}
.status.approved{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.status.proposed{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.status.legacy{color:var(--legacy);background:color-mix(in srgb,var(--legacy) 12%,transparent)}
.status.native{color:var(--cat);background:color-mix(in srgb,var(--cat) 12%,transparent)}
.status.soon{color:var(--dim);background:#171512}
.status.draft{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}

.main{min-width:0;display:grid;grid-template-rows:auto auto minmax(0,1fr);background:#11100e}
.top{grid-row:1;background:var(--panel);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;align-items:center;gap:12px;min-width:0}
.arrow{width:31px;height:31px;border:1px solid var(--bd);background:var(--muted);color:var(--fg);border-radius:9px;display:grid;place-items:center;cursor:pointer}
.arrow svg{width:14px;height:14px}.arrow:disabled{opacity:.35}
.title{min-width:0;flex:1}.title h2{font-family:'Baloo 2';font-weight:800;font-size:15px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title p{font-size:9.5px;color:var(--dim);font-weight:700;margin:1px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.original{font-family:'Baloo 2';font-size:10.5px;font-weight:800;color:var(--cat);text-decoration:none;border:1px solid var(--bd);
  border-radius:8px;padding:6px 9px;background:var(--muted)}
.fullscreen-toggle{height:31px;border:1px solid var(--bd);background:var(--muted);color:var(--fg);border-radius:9px;padding:0 10px;
  display:flex;align-items:center;gap:6px;cursor:pointer;font-family:'Baloo 2';font-size:10.5px;font-weight:800;white-space:nowrap}
.fullscreen-toggle svg{width:14px;height:14px}
.viewbar{grid-row:2;display:none;align-items:center;gap:10px;padding:8px 14px;background:#181613;border-bottom:1px solid var(--bd);min-width:0}
.viewbar.on{display:flex}
.viewbar-label{font-family:'Baloo 2';font-size:9px;font-weight:800;color:var(--dim);letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.view-options{display:flex;align-items:center;gap:5px;min-width:0;overflow:auto}
.view-option{border:1px solid var(--bd);border-radius:8px;background:#211e1a;color:var(--mut);padding:5px 10px;
  font-family:'Baloo 2';font-size:10.5px;font-weight:800;white-space:nowrap;cursor:pointer}
.view-option:hover{color:var(--fg);background:var(--muted)}
.view-option.on{color:#101820;background:var(--cat);border-color:var(--cat)}
.stage{grid-row:3;position:relative;min-height:0;padding:12px 12px 76px}
.viewport{width:100%;height:100%;border:1px solid var(--bd);border-radius:14px;background:#1a1714;overflow:hidden;
  box-shadow:0 18px 50px rgba(0,0,0,.38)}
iframe{width:100%;height:100%;border:0;background:#1a1714}
.placeholder-view{width:100%;height:100%;display:none;align-items:center;justify-content:center;padding:40px;background:
  radial-gradient(circle at 70% 18%,rgba(75,156,211,.12),transparent 34%),#1a1714}
.placeholder-view.on{display:flex}
.placeholder-card{width:min(760px,100%);border:1px solid #3c352d;border-radius:22px;background:#24201b;padding:34px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.placeholder-crumb{font-size:10px;color:#8f8475;font-weight:800;text-transform:uppercase;letter-spacing:.1em}
.placeholder-card h3{font-family:'Baloo 2';font-size:34px;line-height:1.04;margin:12px 0 8px}
.placeholder-card p{color:#b5aa9a;font-size:14px;line-height:1.6;margin:0;max-width:600px}
.placeholder-pill{display:inline-flex;margin-top:22px;border-radius:999px;padding:7px 11px;background:rgba(75,156,211,.12);color:#7fc1e9;
  font-family:'Baloo 2';font-size:11px;font-weight:800}
/* Not-yet-drawn tabs still carry three named design directions so the bottom
   A/B/C switcher is present everywhere WITHOUT faking a mockup. The dashed
   border and the "not yet drawn" pill are the honesty signal — never remove
   them from a direction that has no source HTML behind it. */
.placeholder-direction{margin-top:24px;border:1px dashed #4a4238;border-radius:14px;background:#1e1a16;padding:16px 18px}
.pd-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.pd-letter{font-family:'Baloo 2';font-size:11px;font-weight:800;color:#101820;background:var(--cat);border-radius:999px;padding:2px 9px}
.pd-name{font-family:'Baloo 2';font-size:16px;font-weight:800;color:var(--fg)}
.pd-status{font-family:'Baloo 2';font-size:9px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#c9a05e;
  background:rgba(231,176,106,.13);border-radius:999px;padding:3px 8px}
.pd-desc{margin:9px 0 0;color:#a1968a;font-size:12.5px;line-height:1.55;max-width:620px}
.loading{position:absolute;inset:12px 12px 76px;display:grid;place-items:center;color:var(--dim);font-family:'Baloo 2';font-weight:800;pointer-events:none}
.loading.hide{display:none}

.switcher{position:absolute;left:50%;bottom:17px;transform:translateX(-50%);display:flex;align-items:center;gap:7px;padding:6px;
  background:#f7f3ec;color:#211e1a;border-radius:999px;box-shadow:0 15px 38px rgba(0,0,0,.5);z-index:4}
.switcher button{width:34px;height:34px;border:0;border-radius:50%;background:#27231f;color:#fff;display:grid;place-items:center;cursor:pointer}
.switcher button svg{width:14px;height:14px}
.switcher.off{display:none}
.lab.fullscreen{grid-template-columns:1fr}
.lab.fullscreen .side{display:none}
.lab.fullscreen .main{grid-template-rows:minmax(0,1fr)}
.lab.fullscreen .top{position:fixed;right:12px;top:12px;z-index:20;background:transparent;border:0;padding:0;pointer-events:none}
.lab.fullscreen .top>*:not(.fullscreen-toggle){display:none}
.lab.fullscreen .fullscreen-toggle{pointer-events:auto;background:rgba(33,30,26,.92);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.lab.fullscreen .stage{grid-row:1;padding:0}
.lab.fullscreen .viewbar{position:fixed;left:12px;top:12px;z-index:20;border:1px solid var(--bd);border-radius:10px;
  background:rgba(24,22,19,.94);box-shadow:0 10px 30px rgba(0,0,0,.45);max-width:calc(100vw - 190px)}
.lab.fullscreen .viewport{border:0;border-radius:0}
.lab.fullscreen .loading{inset:0}
/* The A/B/C switcher stays available in full screen too — comparing layouts at
   realistic width is exactly when you need it. It floats and fades back until
   hovered so it never competes with the mockup. */
.lab.fullscreen .switcher{bottom:14px;opacity:.34;transition:opacity .16s ease}
.lab.fullscreen .switcher:hover,.lab.fullscreen .switcher:focus-within{opacity:1}
.lab.fullscreen .switcher{display:none}
.vtext{width:300px;text-align:center;line-height:1.1}.vtext b{font-family:'Baloo 2';font-size:12.5px;font-weight:800}
.vtext span{display:block;font-size:8.5px;color:#776f65;font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button:focus-visible,a:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(max-width:780px){
  .lab{grid-template-columns:1fr}.side{display:none}.top{padding:8px}.stage{padding:7px 7px 72px}.loading{inset:7px 7px 72px}
  .vtext{width:230px}.original{display:none}
}
</style>
</head>
<body>
<div class="lab">
  <aside class="side">
    <div class="brand">
      <h1>Mockup variant lab</h1>
      <p>Product order · completed work gets A / B / C</p>
      <div class="progress"><i></i></div>
    </div>
    <nav class="nav" id="page-nav" aria-label="Mockup pages"></nav>
  </aside>

  <main class="main">
    <header class="top">
      <button class="arrow" id="prev-page" aria-label="Previous page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m15 18-6-6 6-6"/></svg></button>
      <button class="arrow" id="next-page" aria-label="Next page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m9 18 6-6-6-6"/></svg></button>
      <div class="title"><h2 id="page-title"></h2><p id="page-description"></p></div>
      <a class="original" id="original-link" target="_blank">Open untouched original ↗</a>
      <button class="fullscreen-toggle" id="fullscreen-toggle" aria-pressed="false" aria-label="Enter full screen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
        <span>Full screen</span>
      </button>
    </header>
    <div class="viewbar" id="viewbar" aria-label="Product view selector">
      <span class="viewbar-label" id="viewbar-label">View</span>
      <div class="view-options" id="view-options"></div>
    </div>
    <section class="stage">
      <div class="viewport">
        <iframe id="preview" title="Selected mockup variant"></iframe>
        <div class="placeholder-view" id="placeholder-view">
          <article class="placeholder-card">
            <div class="placeholder-crumb" id="placeholder-crumb"></div>
            <h3 id="placeholder-title"></h3>
            <p id="placeholder-copy"></p>
            <span class="placeholder-pill">Mockup coming soon</span>
            <div class="placeholder-direction" id="placeholder-direction">
              <div class="pd-head">
                <span class="pd-letter" id="pd-letter">A</span>
                <span class="pd-name" id="pd-name"></span>
                <span class="pd-status">Direction only · not yet drawn</span>
              </div>
              <p class="pd-desc" id="pd-desc"></p>
            </div>
          </article>
        </div>
      </div>
      <div class="loading" id="loading">Loading mockup…</div>
      <div class="switcher" id="variant-switcher" aria-label="Variant switcher">
        <button id="prev-variant" aria-label="Previous variant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m15 18-6-6 6-6"/></svg></button>
        <div class="vtext"><b id="variant-title"></b><span id="variant-description"></span></div>
        <button id="next-variant" aria-label="Next variant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
    </section>
  </main>
</div>

<script>
const BASE_INJECTED_CSS = `
  html{scrollbar-color:#4a4238 #211e1a}
  body{transition:none!important}
  body::before{
    content:attr(data-lab-label);position:fixed;right:12px;top:12px;z-index:99999;
    background:rgba(20,18,15,.86);color:#ece3d4;border:1px solid #4a4238;border-radius:999px;
    padding:5px 9px;font:800 9px 'Baloo 2',sans-serif;letter-spacing:.04em;box-shadow:0 8px 20px rgba(0,0,0,.35)
  }
  .psw{display:none!important}
  .frame,.wrap,.split,.wide,.page-head,.head,.note{max-width:100%!important}
  @media(max-width:720px){body::before{display:none}}
`;

const profiles = [
  {
    id:"empty-states",group:"Academics",name:"Empty states",status:"native",
    path:"01-academics/academics-empty-states-prototype.html",native:true,
    desc:"Zero-class cold start using the MascotNote empty-state pattern.",
    variants:[
      ["Guided launchpad","One calm day-one action with outcomes underneath."],
      ["Setup explained","Action-first split with a practical setup guide."],
      ["In-place collection","The empty state lives where the class collection will appear."]
    ]
  },
  {
    id:"planner",group:"Academics",name:"Planner",status:"native",
    path:"01-academics/academics-planner-prototype.html",native:true,
    desc:"Future-term sequencing with requirement effects and live GPA outcomes.",
    variants:[
      ["Timeline first","The whole plan and MCAT divider lead."],
      ["Next-term builder","One semester becomes the working surface."],
      ["Decision inspector","Selected-course effects and provenance lead."]
    ]
  },
  {
    id:"assignments",group:"Academics",name:"Assignments",status:"approved",
    path:"01-academics/academics-assignments.html",
    desc:"Agenda, weekly board, calendar, and projected workload.",
    variants:[
      ["Agenda","The day-to-day assignment queue fills one review canvas."],
      ["Weekly board","The same workload is organized across the week."],
      ["Calendar","Month planning and its detail rail fill one review canvas."]
    ],
    b:`
      .vlabel,.vnote{display:none!important}
      .frame>.fbar,.frame>.body{display:none!important}
      .frame>.fbar:nth-child(5),.frame>.body:nth-child(6){display:flex!important}
      .frame>.body:nth-child(6){display:block!important}
      .frame>.body{padding:18px 28px 40px!important}
      .frame>.body>.card{max-width:1180px;margin:auto;min-height:620px}
    `,
    c:`
      .vlabel,.vnote{display:none!important}
      .frame>.fbar,.frame>.body{display:none!important}
      .frame>.fbar:nth-child(13),.frame>.body:nth-child(14){display:flex!important}
      .frame>.body:nth-child(14){display:block!important}
      .frame>.body{padding:18px 28px 40px!important}
      .frame>.body>.card{max-width:1180px;margin:auto;min-height:650px}
    `
  },
  {
    id:"daily-main",group:"Academics",name:"Daily · Class Center",status:"approved",
    path:"01-academics/academics-daily-main-page.html",
    desc:"The populated Academics landing page and cross-class study outlook.",
    variants:[
      ["Approved bento","The approved mixed-size control panel."],
      ["Study cockpit","Queue and weak topics lead; supporting panels form a right rail."],
      ["Class-first canvas","Class cards lead, with compact intelligence below."]
    ],
    b:`
      .bento{grid-template-columns:minmax(0,1.65fr) minmax(300px,.75fr)!important}
      .bento>.c12{grid-column:1/-1!important}
      .bento>.c7{grid-column:1!important}.bento>.c5,.bento>.c4{grid-column:2!important}
      .bento>.card:nth-child(n+7){grid-column:1/-1!important}
    `,
    c:`
      .bento{display:flex!important;flex-direction:column!important}
      .bento>.card:nth-child(2){order:-3}.bento>.card:nth-child(4){order:-2}.bento>.card:nth-child(1){order:-1}
      .ccards{display:grid!important;grid-template-columns:repeat(3,minmax(190px,1fr))!important}
      .cc{width:auto!important}.smart .bd>div{grid-template-columns:repeat(3,1fr)!important}
    `
  },
  {
    id:"class-hub",group:"Academics",name:"Class hub",status:"approved",
    path:"01-academics/academics-class-hub.html",
    desc:"Five-tab per-class workspace and study loop.",
    keys:["A","B","C","D","E"],
    variants:[
      ["Overview","The class overview appears as one complete workspace."],
      ["Materials","The weekly materials library opens as its own view."],
      ["Topics","The course topic map opens as its own view."],
      ["Assignments","Class-scoped work is grouped by syllabus category with grades and what-if."],
      ["Notes","Class intel, questions, priming, and lecture notes open as their own view."]
    ],
    b:`
      .frame>.lab,.frame>.wrap{display:none!important}
      .frame>.wrap:nth-child(3){display:block!important;padding:18px 28px 50px!important}
      .frame>.wrap:nth-child(3) .bento{grid-template-columns:1.5fr 1fr!important}
    `,
    c:`
      .frame{width:min(1700px,100%)!important;display:grid!important;grid-template-columns:1fr 1fr;align-items:start}
      .frame>.ban,.frame>h1{grid-column:1/-1}
      .frame>.lab{display:none!important}
      .frame>.wrap{padding:10px!important}
      .frame>.wrap:nth-child(3){grid-column:1/-1}
      .frame>.wrap .bento{grid-template-columns:1fr 1fr!important}
    `
  },
  {
    id:"class-types",group:"Academics",name:"Class types",status:"approved",
    path:"01-academics/academics-class-types.html",
    desc:"STEM, Writing, and General parity across class workspaces.",
    variants:[
      ["Class-type comparison","STEM and Writing are compared on one fitted canvas."],
      ["STEM class","The STEM workspace opens by itself."],
      ["Writing class","The writing workspace opens by itself."]
    ],
    b:`
      .split{grid-template-columns:1fr!important;max-width:1180px!important}
      .half{min-height:auto!important}.page-head{position:sticky;top:0;z-index:5}
    `,
    c:`
      body{display:flex!important;flex-direction:column}
      .wide{order:-1!important}.page-head{order:-2!important}
      .split{grid-template-columns:1fr 1fr!important}
      .split .body{display:none!important}
      .note{display:none!important}
    `
  },
  {
    id:"exam-prep",group:"Academics",name:"Exam-plan builder",status:"proposed",
    path:"01-academics/academics-exam-prep-mode.html",
    desc:"Accelerated, steady, and catch-up exam preparation states.",
    variants:[
      ["Accelerated","The default nine-day plan opens as one complete screen."],
      ["Steady","The steady-mode plan and clocked-out state open separately."],
      ["Catch-up","The detected three-day catch-up plan opens separately."]
    ],
    b:`
      body>.framelabel,body>.frame{display:none!important}
      body>.framelabel:nth-child(1),body>.frame:nth-child(2){display:block!important}
      body>.frame:nth-child(2){margin-bottom:50px!important}
    `,
    c:`
      body{display:grid!important;grid-template-columns:repeat(3,minmax(420px,1fr));align-items:start;gap:14px;padding:14px!important}
      body>.framelabel{width:auto!important;margin:0!important}
      body>.frame{width:100%!important;margin:0!important}
      body>.framelabel:nth-child(1){grid-column:1}body>.frame:nth-child(2){grid-column:1}
      body>.framelabel:nth-child(3){grid-column:2;grid-row:1}body>.frame:nth-child(4){grid-column:2;grid-row:2}
      body>.framelabel:nth-child(5){grid-column:3;grid-row:1}body>.frame:nth-child(6){grid-column:3;grid-row:2}
    `
  },
  {
    id:"review-session",group:"Academics",name:"Review session",status:"approved",
    path:"01-academics/academics-review-session.html",
    desc:"Active-recall cue, composer, confidence, reveal, and grading loop.",
    variants:[
      ["Session start","The scenic queue introduction opens as one screen."],
      ["Recall","The active recall composer opens as one focused screen."],
      ["Gap report","The missed-concept report and cited source open as one screen."]
    ],
    b:`
      .frame>.lab{display:none!important}
      .frame>.scene,.frame>.focus{display:none!important}
      .frame>.focus:nth-child(5){display:block!important;min-height:100vh}
    `,
    c:`
      .frame{width:min(1600px,100%)!important;display:grid!important;grid-template-columns:1fr 1fr;gap:12px;padding:12px!important}
      .frame>.lab{display:none!important}
      .frame>.scene,.frame>.focus{margin:0!important;min-height:620px}
    `
  },
  {
    id:"syllabus-import",group:"Academics",name:"Syllabus import",status:"proposed",
    path:"01-academics/academics-syllabus-import.html",
    desc:"Upload, parse, review-before-apply, diff, and failure recovery.",
    variants:[
      ["Upload","The cold-start upload and parsing state opens alone."],
      ["Review before apply","The consequential review workspace opens alone."],
      ["Re-import diff","The safe diff and failure-recovery state opens alone."]
    ],

  Object.assign(asProductViews(byId["class-types"],"Class example",["comparison","stem","writing"]),
    {group:"Academics & GPA",section:"Daily · supporting flows",depth:2,fitCanvas:true,authoredViews:"class-types"}),
  Object.assign(byId.planner,{group:"Academics & GPA",name:"Planner",section:"Planning",depth:1,fitCanvas:true}),
  Object.assign(asProductViews(byId["requirements"],"Tracker section",["audit","requirements","prior-credit"]),
    {group:"Academics & GPA",section:"Planning",depth:1,fitCanvas:true,authoredViews:"wrap-per-view"}),
  Object.assign(asProductViews(byId["grades-archive"],"Record view",["ledger","gpa","what-if"]),
    {group:"Academics & GPA",section:"Planning",depth:1,fitCanvas:true,authoredViews:"wrap-per-view"}),

  placehold("mcat-dashboard","MCAT","Dashboard",
    "The phase-aware MCAT home and test-day panel have not been mocked yet."),
  Object.assign(byId["mcat-plan"],{group:"MCAT",name:"Plan",section:"",depth:0,status:"draft",single:true,
    desc:"Existing early Plan concept, retained as a draft source rather than a finished variant set."}),
  placehold("mcat-content","MCAT","Content",

  Object.assign(byId["mcat-bookshelf"],{group:"MCAT",name:"Bookshelf",section:"Content",depth:1,status:"draft",single:true,
    desc:"Existing Bookshelf draft, correctly nested inside the Content tab."}),
  placehold("mcat-questions","MCAT","Questions",
    "Question practice and runner states have not been mocked yet."),
  placehold("mcat-mistakes","MCAT","Mistakes",
    "Mistake-to-Mastery review will live in this tab."),
  Object.assign(byId["mcat-drills"],{group:"MCAT",name:"M2M drills",section:"Mistakes",depth:1,status:"draft",single:true,
    desc:"Existing section-aware remediation draft, nested under Mistakes."}),
  placehold("mcat-stats","MCAT","Stats",
    "Performance trends, stamina, and section-level analytics have not been mocked yet."),
  placehold("mcat-advisor","MCAT","Advisor",
    "Advisor guidance and recommendations have not been mocked yet."),

  placehold("letters","Letters of Rec","Letters of Rec",
    "Recommendation-letter workflows will be mocked after the current Academics and MCAT work."),
  placehold("experiences-clinical","Experiences","Clinical",
    "This product area is organized here but is outside the current mockup pass."),
  placehold("volunteering","Experiences","Volunteering",
    "This product area is organized here but is outside the current mockup pass."),
  placehold("shadowing","Experiences","Shadowing",
    "This product area is organized here but is outside the current mockup pass."),
  placehold("research","Experiences","Research",
    "This product area is organized here but is outside the current mockup pass."),
  placehold("extracurriculars","Experiences","Extracurriculars",
    "This product area is organized here but is outside the current mockup pass."),
  placehold("essays","Your Story","Essays & Story Bank",
    "Story-bank and essay workflows will be mocked in a later pass."),
  placehold("school-list","Application","School List",
    "School research and list-building will be mocked in a later pass."),
  placehold("timeline-tasks","Application","Timeline & Tasks",
    "Application planning and task management will be mocked in a later pass."),
  placehold("profile","Profile","Profile / CV",
    "Profile and CV surfaces will be mocked in a later pass."),
  placehold("help","Support","Help",
    "Help and guidance surfaces will be mocked in a later pass."),
  placehold("settings","Support","Settings",
    "Settings will be mocked in a later pass."),

  Object.assign(byId["mode-switch"],{group:"Archived concepts",name:"Old Daily / Planning concept",section:"",depth:0,single:true}),
  Object.assign(byId["old-study-hub"],{group:"Archived concepts",name:"Old study hub concept",section:"",depth:0,single:true}),
  Object.assign(byId.clinical,{group:"Archived concepts",name:"Old clinical pillar concept",section:"",depth:0,single:true})
];
profiles.splice(0,profiles.length,...orderedProfiles);

const variants = ["A","B","C"];
const lab = document.querySelector(".lab");
const preview = document.getElementById("preview");
const loading = document.getElementById("loading");
const placeholderView = document.getElementById("placeholder-view");
const variantSwitcher = document.getElementById("variant-switcher");
const viewbar = document.getElementById("viewbar");
const viewbarLabel = document.getElementById("viewbar-label");
const viewOptions = document.getElementById("view-options");
const fullscreenToggle = document.getElementById("fullscreen-toggle");
const params = new URLSearchParams(location.search);
let pageIndex = Math.max(0, profiles.findIndex(p => p.id === params.get("page")));
let viewIndex = Math.max(0, (profiles[pageIndex].views || []).findIndex(view => view.slug === params.get("view")));
let variantIndex = Math.max(0, variants.indexOf((params.get("variant") || "A").toUpperCase()));

function current(){ return profiles[pageIndex] }
function currentView(){ return current().views?.[viewIndex] }
/* page -> product view -> design variant. Product-view pages resolve their
   A/B/C from VIEW_VARIANTS keyed by the SELECTED view; flat pages keep their
   page-level set. Never collapse these two back into one array. */
function currentVariantSet(){
  const page=current(), view=currentView();
  const perView=view && page.viewVariants?.[view.slug];
  if(perView) return {variants:perView.v, b:perView.b, c:perView.c};
  return {variants:page.variants, b:page.b, c:page.c};
}
function currentKeys(){ return variants.slice(0,currentVariantSet().variants?.length || 1) }
function currentKey(){ return currentKeys()[variantIndex] || currentKeys()[0] }
function writeUrl(){
  const url = new URL(location.href);
  url.searchParams.set("page",current().id);
  url.searchParams.set("variant",currentKey());
  if(currentView()) url.searchParams.set("view",currentView().slug);
  else url.searchParams.delete("view");
  history.replaceState({},"",url);
}
function renderNav(){
  const nav = document.getElementById("page-nav");
  nav.innerHTML = "";
  let lastGroup = "", lastSection = "";
  profiles.forEach((page,index) => {
    if(page.group !== lastGroup){
      const label = document.createElement("div"); label.className="group"; label.textContent=page.group; nav.append(label); lastGroup=page.group;
      lastSection="";
    }
    if(page.section && page.section !== lastSection){
      const sub = document.createElement("div"); sub.className="subgroup"; sub.textContent=page.section; nav.append(sub); lastSection=page.section;
    }
    const button = document.createElement("button");
    button.className=`pagebtn depth${page.depth||0} ${index===pageIndex?"on":""}`;
    /* Every entry now advertises three A/B/C slots. Placeholders say "directions"
       because nothing is drawn behind them yet; drafts say so too. */
    const meta=page.placeholder ? `Not mocked · ${page.variants.length} directions`
      : page.single ? `Draft source · ${page.variants.length} variants`
      : page.views ? `${page.views.length} views · A/B/C each`
      : `${page.variants.length} variants`;
    const statusLabel=page.status==="soon" ? "soon" : page.status==="native" ? "prototype" : page.status;
    button.innerHTML=`<span><span class="pname">${page.name}</span><span class="pmeta">${meta}</span></span><span class="status ${page.status}">${statusLabel}</span>`;
    button.addEventListener("click",()=>selectPage(index));
    nav.append(button);
  });
}
function selectPage(index){
  pageIndex=(index+profiles.length)%profiles.length;
  variantIndex=0;
  viewIndex=0;
  writeUrl(); renderAll(true);
}
function selectView(index){
  const views=current().views;
  if(!views?.length) return;
  viewIndex=(index+views.length)%views.length;
  /* Variant sets are per-view, so clamp rather than carry an out-of-range index. */
  variantIndex=Math.min(variantIndex,Math.max(0,currentKeys().length-1));
  writeUrl(); renderViewbar(); renderMeta(); loadOrApply(false);
}
function cyclePage(direction){selectPage(pageIndex+direction)}
/* The switcher is live on every tab, including placeholders — on those it moves
   between named directions rather than between rendered layouts. */
function cycleVariant(direction){
  if(currentKeys().length<=1) return;
  const keys=currentKeys();
  variantIndex=(variantIndex+direction+keys.length)%keys.length;
  writeUrl(); renderMeta(); loadOrApply(false);
}
function renderViewbar(){
  const page=current(), views=page.views || [];
  viewbar.classList.toggle("on",views.length>0);
  viewbarLabel.textContent=page.viewKind || "View";
  viewOptions.innerHTML="";
  views.forEach((view,index)=>{
    const button=document.createElement("button");
    button.className=`view-option ${index===viewIndex ? "on" : ""}`;
    button.textContent=view.name;
    button.title=view.desc;
    button.setAttribute("aria-pressed",String(index===viewIndex));
    button.addEventListener("click",()=>selectView(index));
    viewOptions.append(button);
  });
}
function renderMeta(){
  const page=current(), letter=currentKey();
  const detail=currentVariantSet().variants?.[variantIndex] || ["Coming soon","This surface is not part of the current variant pass."];
  document.getElementById("page-title").textContent=`${pageIndex+1} of ${profiles.length} · ${page.name}`;
  document.getElementById("page-description").textContent=currentView()
    ? `${page.viewKind}: ${currentView().name} · ${currentView().desc}`
    : page.desc;
  document.getElementById("variant-title").textContent=`${letter} — ${detail[0]}`;
  document.getElementById("variant-description").textContent=detail[1];
  const original=document.getElementById("original-link");
  original.hidden=!!page.placeholder;
  if(page.path) original.href=page.path;
  /* Present on every tab. Only hidden if a surface genuinely has one option. */
  variantSwitcher.classList.toggle("off",currentKeys().length<=1);
  document.getElementById("prev-page").disabled=pageIndex===0;
  document.getElementById("next-page").disabled=pageIndex===profiles.length-1;
}
function injectedCss(page,letter){
  if(letter==="A") return BASE_INJECTED_CSS;
  const set=currentVariantSet();
  /* Product-view pages are isolated by isolateAuthoredView() BEFORE this lands,
     so their treatments only ever target descendants of the isolated view. */
  return BASE_INJECTED_CSS + ((letter==="B" ? set.b : set.c) || "");
}
/* Hide the siblings, but do NOT force a display on the survivor.
   An inline `display:block !important` beats stylesheet `!important`, so the
   old version silently defeated any variant treatment that tried to make the
   isolated view a grid or a multi-column layout. Clearing the property lets
   the source's own CSS apply and leaves variant CSS free to override it. */
function showOnly(elements,index){
  elements.forEach((element,itemIndex)=>{
    if(itemIndex===index) element.style.removeProperty("display");
    else element.style.setProperty("display","none","important");
  });
  return elements[index];
}
function isolateAuthoredView(page,doc,index){
  if(page.authoredViews==="class-types"){
    const split=doc.querySelector(".split"), halves=[...doc.querySelectorAll(".split > .win")];
    doc.querySelectorAll(".page-head,.wide,.note").forEach(item=>item.style.setProperty("display","none","important"));
    if(index===0){
      split.style.setProperty("display","grid","important");
      halves.forEach(item=>item.style.setProperty("display","block","important"));
    }else{
      split.style.setProperty("display","block","important");
      halves.forEach((item,itemIndex)=>item.style.setProperty("display",itemIndex===index-1 ? "block" : "none","important"));
    }
    return split;
  }
  const frame=doc.querySelector(".frame");
  if(!frame) return null;
  if(page.authoredViews==="top-frames"){
    doc.querySelectorAll("body > .framelabel").forEach(label=>label.style.setProperty("display","none","important"));
    const selected=showOnly([...doc.querySelectorAll("body > .frame")],index);
    if(page.id==="exam-prep" && index===0){
      selected.querySelectorAll(".day").forEach((day,dayIndex)=>{
        if(dayIndex>=3) day.style.setProperty("display","none","important");
      });
    }
    /* Syllabus import "Review before apply" used to be forced into a two-column
       grid here. That is a LAYOUT decision, not an isolation concern, and it
       made design A identical to design B. The two-column arrangement now lives
       where it belongs — in that view's B treatment. Isolation only isolates. */
    return selected;
  }
  if(page.authoredViews==="assignments"){
    frame.querySelectorAll(":scope > .vlabel,:scope > .vnote").forEach(item=>item.style.setProperty("display","none","important"));
    const bars=[...frame.querySelectorAll(":scope > .fbar")];
    const bodies=[...frame.querySelectorAll(":scope > .body")];
    bars.forEach((item,itemIndex)=>item.style.setProperty("display",itemIndex===index ? "flex" : "none","important"));
    bodies.forEach((item,itemIndex)=>item.style.setProperty("display",itemIndex===index ? "block" : "none","important"));
    if(index===0){
      bodies[0]?.querySelectorAll(".acard").forEach((card,cardIndex)=>{
        if(cardIndex>=4) card.style.setProperty("display","none","important");
      });
    }
    return frame;
  }
  /* The ".wrap-per-view" DOM contract: .frame holds a banner plus one .wrap
     per product view, with .lab captions between them. Class Hub established
     it; Requirements and Grades & Archive reuse it. A new page only has
     to match that shape — no new isolation branch needed. */
  if(page.authoredViews==="class-hub" || page.authoredViews==="wrap-per-view"){
    frame.querySelectorAll(":scope > .lab").forEach(item=>item.style.setProperty("display","none","important"));
    showOnly([...frame.querySelectorAll(":scope > .wrap")],index);
    frame.querySelectorAll(".tb").forEach((tab,tabIndex)=>tab.classList.toggle("on",tabIndex===index));
    return frame;
  }
  if(page.authoredViews==="review-session"){
    frame.querySelectorAll(":scope > .lab").forEach(item=>item.style.setProperty("display","none","important"));
    showOnly([...frame.querySelectorAll(":scope > .scene,:scope > .focus")],index);
    return frame;
  }
  return frame;
}
function fitCanvas(doc,canvas){
  if(!canvas) return;
  const body=doc.body, root=doc.documentElement, win=doc.defaultView;
  const exploring=lab.classList.contains("fullscreen");
  root.style.setProperty("height",exploring ? "auto" : "100%","important");
  root.style.setProperty("min-height","100%","important");
  root.style.setProperty("overflow-x","hidden","important");
  root.style.setProperty("overflow-y",exploring ? "auto" : "hidden","important");
  body.style.setProperty("height",exploring ? "auto" : "100%","important");
  body.style.setProperty("min-height",exploring ? "100%" : "0","important");
  body.style.setProperty("min-width","0","important");
  body.style.setProperty("width","100%","important");
  body.style.setProperty("overflow",exploring ? "visible" : "hidden","important");
  body.style.setProperty("padding","0","important");
  body.style.setProperty("margin","0","important");
  body.style.setProperty("display","flex","important");
  body.style.setProperty("align-items","flex-start","important");
  body.style.setProperty("justify-content","center","important");
  const resize=()=>{
    canvas.style.zoom="1";
    canvas.style.margin="0";
    const width=Math.max(canvas.scrollWidth,canvas.offsetWidth,1);
    const height=Math.max(canvas.scrollHeight,canvas.offsetHeight,1);
    const scale=exploring
      ? Math.min(win.innerWidth/width,1)
      : Math.min(win.innerWidth/width,win.innerHeight/height,1);
    /* Floor was .35, which silently CLIPPED the tallest single-column views
       (Syllabus import → Review before apply needs ~.30). Clipping is worse
       than small here: the lab's job in normal mode is to show a whole
       composition at a glance, and full screen exists for reading detail. */
    canvas.style.zoom=String(Math.max(.24,scale));
  };
  if(canvas.__labFitFrame) win.cancelAnimationFrame(canvas.__labFitFrame);
  canvas.__labFitFrame=win.requestAnimationFrame(()=>{
    resize();
    canvas.__labFitFrame=0;
  });
}
function applyVariant(){
  const page=current(), letter=currentKey();
  const doc=preview.contentDocument;
  if(!doc?.body) return;
  let style=doc.getElementById("variant-lab-style");
  if(!style){ style=doc.createElement("style"); style.id="variant-lab-style"; doc.head.append(style); }
  style.textContent=injectedCss(page,letter);
  doc.body.dataset.labVariant=letter;
  doc.body.dataset.labLabel=currentView()
    ? `${currentView().name.toUpperCase()} · DESIGN ${letter} — ${(currentVariantSet().variants[variantIndex]||[""])[0].toUpperCase()}`
    : `VARIANT ${letter} · ${currentVariantSet().variants[variantIndex][0].toUpperCase()}`;
  const isolated=page.authoredViews ? isolateAuthoredView(page,doc,viewIndex) : doc.querySelector(".frame");
  if(page.fitCanvas) fitCanvas(doc,isolated);
  loading.classList.add("hide");
}
function desiredSrc(){
  const page=current();
  return page.native ? `${page.path}?variant=${currentKey()}` : page.path;
}
function loadOrApply(force){
  const page=current();
  if(page.placeholder){
    preview.style.display="none";
    placeholderView.classList.add("on");
    document.getElementById("placeholder-crumb").textContent=page.group + (page.section ? ` · ${page.section}` : "");
    document.getElementById("placeholder-title").textContent=page.name;
    document.getElementById("placeholder-copy").textContent=page.desc;
    /* Reflect the selected A/B/C direction without implying a drawn mockup. */
    const direction=currentVariantSet().variants?.[variantIndex];
    const block=document.getElementById("placeholder-direction");
    block.hidden=!direction;
    if(direction){
      document.getElementById("pd-letter").textContent=currentKey();
      document.getElementById("pd-name").textContent=direction[0];
      document.getElementById("pd-desc").textContent=direction[1];
    }
    loading.classList.add("hide");
    return;
  }
  preview.style.display="block";
  placeholderView.classList.remove("on");
  const next=desiredSrc();
  const currentPath=preview.getAttribute("src") || "";
  const mustReload=force || current().native || currentPath.split("?")[0]!==next.split("?")[0];
  if(mustReload){
    loading.classList.remove("hide");
    preview.src=next;
  }else applyVariant();
}
function renderAll(force){
  renderNav(); renderViewbar(); renderMeta(); loadOrApply(force);
}
function refreshCanvasFit(){
  if(current().placeholder) return;
  requestAnimationFrame(()=>applyVariant());
}
function setFullscreen(enabled){
  lab.classList.toggle("fullscreen",enabled);
  fullscreenToggle.setAttribute("aria-pressed",String(enabled));
  fullscreenToggle.setAttribute("aria-label",enabled ? "Exit full screen" : "Enter full screen");
  fullscreenToggle.querySelector("span").textContent=enabled ? "Exit full screen" : "Full screen";
  refreshCanvasFit();
}
preview.addEventListener("load",applyVariant);
document.getElementById("prev-page").addEventListener("click",()=>cyclePage(-1));
document.getElementById("next-page").addEventListener("click",()=>cyclePage(1));
document.getElementById("prev-variant").addEventListener("click",()=>cycleVariant(-1));
document.getElementById("next-variant").addEventListener("click",()=>cycleVariant(1));
fullscreenToggle.addEventListener("click",()=>setFullscreen(!lab.classList.contains("fullscreen")));
addEventListener("keydown",event=>{
  const tag=document.activeElement?.tagName;
  if(tag==="INPUT"||tag==="TEXTAREA"||document.activeElement?.isContentEditable)return;
  if(event.key==="Escape" && lab.classList.contains("fullscreen")){ setFullscreen(false); return; }
  if(event.key==="ArrowLeft")cycleVariant(-1);
  if(event.key==="ArrowRight")cycleVariant(1);
  if(event.key==="ArrowUp")cyclePage(-1);
  if(event.key==="ArrowDown")cyclePage(1);
});
addEventListener("popstate",()=>{
  const next=new URLSearchParams(location.search);
  pageIndex=Math.max(0,profiles.findIndex(p=>p.id===next.get("page")));
  viewIndex=Math.max(0,(profiles[pageIndex].views || []).findIndex(view => view.slug === next.get("view")));
  variantIndex=Math.max(0,variants.indexOf((next.get("variant")||"A").toUpperCase()));
  variantIndex=Math.min(variantIndex,Math.max(0,currentKeys().length-1));
  renderAll(true);
});
renderAll(true);
</script>
