# Builds the app and publishes it to GitHub Pages on every push to main.
# One-time setup required: repo Settings → Pages → Source → "GitHub Actions"
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # lets you re-run it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          # Public/client-safe Supabase keys, injected at build so cloud sync
          # works on the live site. RLS protects the data. Set in repo Secrets.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          # Public build-time release controls. Calendar remains restricted to
          # the Google OAuth tester list until verification is approved.
          VITE_CALENDAR_TESTERS: ${{ vars.VITE_CALENDAR_TESTERS }}
          VITE_CALENDAR_OAUTH_VERIFIED: ${{ vars.VITE_CALENDAR_OAUTH_VERIFIED }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
