<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Premed OS application workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#211e1a;--paper:#2b2722;--soft:#322e28;--line:#3c352d;--ink:#ece3d4;--mut:#a89c8c;--dim:#7c7264;--accent:#6fb3de;--accent-rgb:111,179,222;--good:#75b695;--warn:#e7b06a}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#191613;color:var(--ink);font:14px/1.42 Nunito,system-ui,sans-serif}button,input,textarea{font:inherit}.frame{width:min(1400px,100%);min-height:100vh;margin:auto;padding-bottom:44px;background:var(--bg)}.ban{padding:18px 24px 0;background:radial-gradient(420px 230px at 88% 0,rgba(var(--accent-rgb),.34),transparent 70%),radial-gradient(320px 190px at 8% 130%,rgba(111,192,168,.12),transparent 70%),linear-gradient(115deg,#283446 0%,#303d49 44%,#3a3730 100%)}.bantop{display:flex;align-items:center;justify-content:space-between;gap:18px}.h1{margin:0;font:800 30px/1 'Baloo 2';letter-spacing:-.4px;color:#fff}.stats{display:flex;overflow:hidden;border:1px solid rgba(255,255,255,.16);border-radius:13px;background:rgba(20,26,34,.5);backdrop-filter:blur(15px)}.stat{min-width:104px;padding:8px 14px;border-right:1px solid rgba(255,255,255,.12)}.stat:last-child{border:0}.stat b{display:block;font:800 18px/1 'Baloo 2';color:#fff}.stat span{display:block;margin-top:2px;color:rgba(255,255,255,.6);font-size:9px;font-weight:900;letter-spacing:.07em;text-transform:uppercase}.tabs{display:flex;gap:23px;margin-top:14px;padding:0 24px;border-bottom:1px solid rgba(255,255,255,.13)}.tab{position:relative;padding:10px 2px 11px;border:0;background:transparent;color:rgba(255,255,255,.58);font:700 14px 'Baloo 2'}.tab.on{color:#fff}.tab.on:after{content:"";position:absolute;right:0;bottom:-1px;left:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}.fbar{display:flex;align-items:center;gap:8px;padding:10px 24px;border-bottom:1px solid var(--line);background:var(--paper)}.control{border:1px solid var(--line);border-radius:9px;background:var(--soft);padding:7px 10px;color:var(--mut);font-size:11px;font-weight:800}.control.on{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent) 12%,var(--soft));color:var(--accent)}.spacer{margin-left:auto}.primary{border:0;border-radius:9px;background:var(--accent);padding:8px 12px;color:#17222c;font:800 11px 'Baloo 2'}.wrap{padding:16px 24px}.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:14px}.intro h2{margin:0;font:800 23px/1.05 'Baloo 2'}.intro p{max-width:680px;margin:5px 0 0;color:var(--mut);font-size:12px;font-weight:700}.ey{color:var(--accent);font-size:9px;font-weight:900;letter-spacing:.09em;text-transform:uppercase}.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);gap:14px}.surface{overflow:hidden;border:1px solid var(--line);border-radius:16px;background:var(--paper);box-shadow:0 12px 28px -20px rgba(0,0,0,.9)}.surface-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line)}.surface-head h3{margin:0;font:800 15px 'Baloo 2'}.surface-head span{color:var(--mut);font-size:10px;font-weight:800}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:13px 15px;border-top:1px solid var(--line)}.row:first-child{border-top:0}.row h4{margin:0;font:800 14px 'Baloo 2'}.row p{margin:4px 0 0;color:var(--mut);font-size:11px;font-weight:700}.row-meta{text-align:right;color:var(--mut);font-size:10px;font-weight:800}.row-meta b{display:block;color:var(--ink);font:800 15px 'Baloo 2'}.chip{display:inline-flex;margin:5px 4px 0 0;border-radius:999px;background:color-mix(in srgb,var(--accent) 15%,transparent);padding:3px 7px;color:var(--accent);font-size:9px;font-weight:900}.chip.good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}.chip.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}.sidepad{padding:15px}.sidepad h3{margin:0;font:800 18px 'Baloo 2'}.sidepad p{margin:6px 0 0;color:var(--mut);font-size:11px;font-weight:700}.callout{margin-top:12px;padding:12px;border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));border-radius:11px;background:color-mix(in srgb,var(--accent) 8%,var(--soft));color:var(--mut);font-size:11px;font-weight:700}.callout b{color:var(--ink)}.theme-layout{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:560px}.rail{padding:12px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--soft) 70%,var(--paper))}.rail button{display:flex;justify-content:space-between;width:100%;margin:2px 0;border:0;border-radius:9px;background:transparent;padding:9px;color:var(--mut);font-size:11px;font-weight:800;text-align:left}.rail button.on{background:color-mix(in srgb,var(--accent) 13%,var(--soft));color:var(--ink)}.feed{padding:4px 15px}.entry{padding:14px 0;border-top:1px solid var(--line)}.entry:first-child{border-top:0}.entry h4{margin:0;font:800 14px 'Baloo 2'}.entry p{margin:5px 0;color:var(--mut);font-size:11px;font-weight:700}.entry small{color:var(--dim);font-size:9px;font-weight:900}.desk{display:grid;grid-template-columns:minmax(250px,.8fr) minmax(0,1.35fr) minmax(230px,.75fr);min-height:620px}.desk-col{min-width:0;padding:15px;border-right:1px solid var(--line)}.desk-col:last-child{border:0}.desk-col h3{margin:0 0 10px;font:800 15px 'Baloo 2'}.prompt{padding:12px;border-radius:11px;background:var(--soft);color:var(--ink);font-size:12px;font-weight:800}.material{margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}.material b{display:block;font-size:11px}.material span{color:var(--mut);font-size:9px;font-weight:800}.draft{width:100%;min-height:480px;resize:none;border:1px solid var(--line);border-radius:12px;background:#27231f;padding:15px;color:var(--ink);font:600 13px/1.65 Nunito}.arc{padding:11px;border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--soft));color:var(--mut);font-size:10.5px;font-weight:700}.arc+ .arc{margin-top:9px}.arc b{display:block;color:var(--ink);font:800 11px 'Baloo 2'}.trust{padding:11px 15px;border-top:1px dashed var(--line);color:var(--mut);font-size:10px;font-weight:800}.map{position:relative;min-height:420px;background:radial-gradient(circle at 30% 45%,rgba(var(--accent-rgb),.22),transparent 13%),radial-gradient(circle at 61% 28%,rgba(117,182,149,.18),transparent 12%),radial-gradient(circle at 70% 68%,rgba(231,176,106,.16),transparent 14%),linear-gradient(140deg,#292723,#353027)}.pin{position:absolute;width:14px;height:14px;border:3px solid var(--paper);border-radius:50%;background:var(--accent);box-shadow:0 5px 12px #000}.pin.one{left:29%;top:44%}.pin.two{left:60%;top:27%;background:var(--good)}.pin.three{left:69%;top:67%;background:var(--warn)}.map-label{position:absolute;left:16px;bottom:15px;padding:9px 11px;border:1px solid rgba(255,255,255,.14);border-radius:10px;background:rgba(20,20,18,.75);font-size:10px;font-weight:800}.fact-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:14px}.fact{padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--soft)}.fact b{display:block;font:800 13px 'Baloo 2'}.fact span{color:var(--mut);font-size:9px;font-weight:800}.packet{padding:15px}.packet-section{padding:12px 0;border-top:1px dashed var(--line)}.packet-section:first-child{border-top:0}.packet-section h4{margin:0 0 5px;font:800 12px 'Baloo 2'}.packet-section p{margin:0;color:var(--mut);font-size:10.5px;font-weight:700}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.actions button{border:1px solid var(--line);border-radius:9px;background:var(--soft);padding:7px 9px;color:var(--ink);font-size:10px;font-weight:800}@media(max-width:820px){.grid,.desk{grid-template-columns:1fr}.desk-col{border-right:0;border-bottom:1px solid var(--line)}.stats .stat:nth-child(n+3){display:none}.theme-layout{grid-template-columns:140px minmax(0,1fr)}}@media(max-width:560px){.ban,.fbar,.wrap{padding-left:14px;padding-right:14px}.stats{display:none}.tabs{padding:0;gap:16px;overflow:auto}.theme-layout{grid-template-columns:1fr}.rail{border-right:0;border-bottom:1px solid var(--line)}.fact-grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="frame"><header class="ban"><div class="bantop"><h1 class="h1" id="page-title">School List</h1><div class="stats" id="stats"></div></div><nav class="tabs" id="tabs" aria-label="Page sections"></nav></header><div class="fbar" id="fbar"></div><section class="wrap" id="content"></section></main>
  <script>
    const params=new URLSearchParams(location.search),area=params.get('area')||'school-list',view=params.get('view')||({'school-list':'explore',story:'bank',letters:'people'}[area]);
    const CONFIG={
      'school-list':{title:'School List',accent:'#6fb3de',rgb:'111,179,222',tabs:[['explore','Explore'],['track','Track']],stats:[['240','directory entries'],['2','application services'],['Local','your list stays yours']]},
      story:{title:'Essays & Story Bank',accent:'#be7f91',rgb:'190,127,145',tabs:[['bank','The bank'],['essays','Essays'],['desk','Writing desk']],stats:[['18','your entries'],['7','themes'],['3','essays in motion']]},
      letters:{title:'Letters & Mentors',accent:'#d0a66e',rgb:'208,166,110',tabs:[['people','People'],['dossier','Dossier'],['requests','Requests']],stats:[['9','people'],['2','two-time instructors'],['Oct 12','last contact']]}
    },c=CONFIG[area]||CONFIG['school-list'];
    document.documentElement.style.setProperty('--accent',c.accent);document.documentElement.style.setProperty('--accent-rgb',c.rgb);document.getElementById('page-title').textContent=c.title;
    document.getElementById('stats').innerHTML=c.stats.map(s=>`<div class="stat"><b>${s[0]}</b><span>${s[1]}</span></div>`).join('');
    document.getElementById('tabs').innerHTML=c.tabs.map(t=>`<button class="tab ${t[0]===view?'on':''}" data-view="${t[0]}">${t[1]}</button>`).join('');
    document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>{if(parent!==window){parent.postMessage({type:'mockup-lab:select-view',view:button.dataset.view},location.origin);return}const u=new URL(location.href);u.searchParams.set('view',button.dataset.view);location.href=u}));
    const fbar=document.getElementById('fbar'),content=document.getElementById('content');
    const controls=(left,action)=>{fbar.innerHTML=left.map((x,i)=>`<button class="control ${i===0?'on':''}">${x}</button>`).join('')+`<span class="spacer"></span>${action?`<button class="primary">${action}</button>`:''}`};
    function schoolExplore(){controls(['All schools','MD + DO','Any state'],'＋ Add school');content.innerHTML=`<div class="intro"><div><span class="ey">Explore</span><h2>Start with a trustworthy directory, not a fit score</h2><p>Directory facts stay separate from optional sourced profiles and your own judgments. A blank profile field remains blank.</p></div></div><div class="grid"><section class="surface"><div class="surface-head"><h3>School directory</h3><span>official roster · static snapshot</span></div><div class="map"><i class="pin one"></i><i class="pin two"></i><i class="pin three"></i><div class="map-label">Map shows location only · no invented selectivity layer</div></div></section><aside class="surface"><div class="row"><div><h4>UNC School of Medicine</h4><p>Chapel Hill, NC · AMCAS · MD</p><span class="chip good">In-state</span></div><div class="row-meta"><b>Official</b>directory</div></div><div class="row"><div><h4>Campbell University CUSOM</h4><p>Buies Creek, NC · AACOMAS · DO</p><span class="chip">North Carolina</span></div><div class="row-meta"><b>Official</b>directory</div></div><div class="row"><div><h4>Regional campus entry</h4><p>Shown only when its parent-school relationship is available</p><span class="chip warn">Profile unavailable</span></div><div class="row-meta"><b>—</b>no guess</div></div><div class="trust"><b>Data trust:</b> roster facts · optional sourced school profile · student-owned planning facts. Never blend the three.</div></aside></div>`}
    function schoolTrack(){controls(['My list','All cycles','Active'],'Export CSV');content.innerHTML=`<div class="intro"><div><span class="ey">Track</span><h2>Your list is the comparison</h2><p>Why it is here, your tier, service-specific state, prerequisites present in your record, and pasted secondary prompts live together.</p></div></div><div class="grid"><section class="surface"><div class="surface-head"><h3>My schools</h3><span>archive, never delete</span></div><div class="row"><div><h4>UNC School of Medicine</h4><p>Why: North Carolina service focus and existing clinical ties</p><span class="chip">Target</span><span class="chip good">AMCAS</span><span class="chip">Secondary received</span></div><div class="row-meta"><b>12 days</b>since received</div></div><div class="row"><div><h4>Campbell University CUSOM</h4><p>Why: community medicine and rural-care exposure</p><span class="chip">Likely</span><span class="chip good">AACOMAS</span><span class="chip warn">2 prerequisites not in record</span></div><div class="row-meta"><b>Not received</b>no non-event status</div></div><div class="row"><div><h4>Wake Forest School of Medicine</h4><p>Your note is blank. The school record is still complete.</p><span class="chip">Reach</span><span class="chip good">AMCAS</span></div><div class="row-meta"><b>$64k</b>student-entered</div></div></section><aside class="surface"><div class="sidepad"><span class="ey">Secondary capture</span><h3>Paste the prompt from your portal</h3><p>Premed OS never fetches, guesses, or pre-fills school prompts. The real text arrives from you.</p><div class="callout"><b>Why are you interested in our program?</b><br>500 words · pasted Aug 12 · source: applicant portal</div><div class="actions"><button>Save prompt</button><button>Open in Writing desk</button></div></div><div class="fact-grid"><div class="fact"><b>Prerequisites</b><span>record presence only · no “satisfies” claim</span></div><div class="fact"><b>Letters</b><span>routes by AMCAS / AACOMAS</span></div><div class="fact"><b>Primary</b><span>service-level, not per-school</span></div><div class="fact"><b>Status</b><span>no rejected / waiting non-events</span></div></div></aside></div>`}
    function storyBank(){controls(['Newest first','All themes','All sources'],'＋ Capture');content.innerHTML=`<div class="intro"><div><span class="ey">The bank</span><h2>Your material, newest first</h2><p>Themes help retrieve; they do not score your life. Journal entries and pillar reflections are the same owned material seen through different doors.</p></div></div><section class="surface theme-layout"><aside class="rail"><button class="on">All material <b>18</b></button><button>Why medicine <b>4</b></button><button>Service <b>3</b></button><button>Challenge <b>3</b></button><button>Identity <b>2</b></button><button>Leadership <b>2</b></button><button>Research <b>3</b></button><button>Other <b>1</b></button></aside><div class="feed"><div class="entry"><small>JOURNAL · YESTERDAY</small><h4>The moment after the call ended</h4><p>I kept thinking about how the family asked the same question three ways. I did not have an answer, but I understood why reassurance had to be specific.</p><span class="chip">Why medicine</span><span class="chip">Communication</span></div><div class="entry"><small>CLINICAL REFLECTION · JUL 12</small><h4>Explaining what would happen next</h4><p>The useful part was not knowing the terminology. It was slowing down enough to make the next ten minutes predictable.</p><span class="chip">Service</span></div><div class="entry"><small>RESEARCH DECISION · JUL 08</small><h4>Why we changed the extraction window</h4><p>A setback became the clearest example of how I respond when the method—not my effort—needs to change.</p><span class="chip">Research</span><span class="chip">Challenge</span></div><div class="entry"><small>ORPHAN ENTRY · JUN 29</small><h4>A thought with no parent yet</h4><p>Not everything needs to become an essay. Saving it is enough.</p></div></div></section>`}
    function storyEssays(){controls(['All essays','In progress','Ready'],'＋ Add essay');content.innerHTML=`<div class="intro"><div><span class="ey">Essays</span><h2>Prompts, limits, deadlines, and status</h2><p>Prompt records are nested under themes but keep their school-specific wording. Premed OS stores the text you pasted; it does not compile prompts from the web.</p></div></div><div class="grid"><section class="surface"><div class="surface-head"><h3>In motion</h3><span>your records</span></div><div class="row"><div><h4>UNC · Why this program?</h4><p>500 words · due with your secondary · prompt pasted from portal</p><span class="chip">Why medicine</span><span class="chip warn">Draft</span></div><div class="row-meta"><b>326</b>words</div></div><div class="row"><div><h4>Personal statement</h4><p>AMCAS · 5,300 characters</p><span class="chip">Why medicine</span><span class="chip good">Ready</span></div><div class="row-meta"><b>5,112</b>characters</div></div><div class="row"><div><h4>Campbell · Service</h4><p>Prompt saved · no deadline entered</p><span class="chip">Service</span><span class="chip">Not started</span></div><div class="row-meta"><b>0</b>words</div></div></section><aside class="surface"><div class="sidepad"><span class="ey">Reuse check</span><h3>One story, two prompts</h3><p>The clinic explanation appears in two drafts. Review whether the reuse is intentional; nothing is blocked.</p><div class="callout"><b>Grounding check</b><br>Every factual claim in the draft can point back to your own record.</div></div></aside></div>`}
    function storyDesk(){controls(['UNC · Why this program?','500 words','Draft'],'Save draft');content.innerHTML=`<div class="intro"><div><span class="ey">Writing desk</span><h2>The question, your material, and your draft—in one frame</h2><p>AI may suggest an arc and cite your records. It never writes into the draft, rewrites your sentences, or creates a personal fact.</p></div></div><section class="surface desk"><aside class="desk-col"><h3>Prompt</h3><div class="prompt">Describe why this program fits your goals and the experiences that prepared you to contribute.</div><h3 style="margin-top:16px">Your material</h3><div class="material"><b>Explaining what happens next</b><span>Clinical · Jul 12</span></div><div class="material"><b>Community partnership</b><span>Volunteering · May 08</span></div><div class="material"><b>Why the method changed</b><span>Research · Apr 19</span></div></aside><div class="desk-col"><h3>Your draft</h3><textarea class="draft">I first understood the difference between giving information and creating clarity during a clinic shift in July...

The same lesson appeared in a different form while working with the Refugee Community Partnership...</textarea><div class="trust">326 / 500 words · your text is never changed without you typing the change</div></div><aside class="desk-col"><h3>Suggested arc</h3><div class="arc"><b>Start</b>Open with the clinic moment where clarity mattered. <small>Source: Clinical · Jul 12</small></div><div class="arc"><b>Develop</b>Connect it to the longer service relationship without claiming the two settings were identical. <small>Source: Volunteering · May 08</small></div><div class="arc"><b>End</b>Name the kind of contribution you want to continue, grounded in the school note you wrote. <small>Source: School List · UNC</small></div><div class="callout"><b>Paste test:</b> this remains direction, not prose that can be pasted as your answer.</div></aside></section>`}
    function lettersPeople(){controls(['All people','Instructors','Mentors'],'＋ Add person');content.innerHTML=`<div class="intro"><div><span class="ey">People</span><h2>The relationship exists before the letter</h2><p>Course instructors arrive automatically. Before application season, request machinery is absent—not disabled—and a mentor needs no letter status.</p></div></div><div class="grid"><section class="surface"><div class="surface-head"><h3>Your people</h3><span>one record across every pillar</span></div><div class="row"><div><h4>Dr. Nadia Elamin</h4><p>CHEM 241 · Fall 2024 · taught you twice</p><span class="chip good">Science instructor</span><span class="chip">Last contact Oct 12</span></div><div class="row-meta"><b>2 courses</b>automatic</div></div><div class="row"><div><h4>Dr. Marcus Okonkwo</h4><p>Morris Lab · PI · shared research project</p><span class="chip">Mentor</span><span class="chip">Last contact 8 days ago</span></div><div class="row-meta"><b>1 project</b>no request</div></div><div class="row"><div><h4>Professor Lena Park</h4><p>ENGL 105 · Spring 2026</p><span class="chip good">Humanities instructor</span><span class="chip warn">No recent contact recorded</span></div><div class="row-meta"><b>1 course</b>automatic</div></div></section><aside class="surface"><div class="sidepad"><span class="ey">Plain coverage shape</span><h3>What your course list contains</h3><p>5 science instructors · 1 humanities or social-science instructor · 3 other mentors.</p><div class="callout">A count, never a readiness score. It does not say you “need” a person or rank anyone's usefulness.</div></div><div class="trust">No relationship score · no letter likelihood · no contact quota</div></aside></div>`}
    function lettersDossier(){controls(['Dr. Nadia Elamin','Relationship record','Links only'],'Add note');content.innerHTML=`<div class="intro"><div><span class="ey">Dossier</span><h2>Prepare for a real conversation</h2><p>The dossier contains their work and your relationship history—never personal details, third-party opinions, or fetched profiles.</p></div></div><div class="grid"><section class="surface"><div class="surface-head"><h3>Dr. Nadia Elamin</h3><span>last contact · Oct 12</span></div><div class="fact-grid"><div class="fact"><b>CHEM 241</b><span>Fall 2024 · A−</span></div><div class="fact"><b>CHEM 262</b><span>Spring 2025 · A</span></div><div class="fact"><b>Shared project</b><span>DPPH assays · Jan–May</span></div><div class="fact"><b>Department page ↗</b><span>link saved · never fetched</span></div></div><div class="packet"><div class="packet-section"><h4>Your running notes</h4><p>Discussed radical stability and the reason our extraction window changed. Interested in wastewater antibiotic resistance.</p></div><div class="packet-section"><h4>Material you brought back</h4><p>“Our group studies resistance genes in wastewater systems...” · pasted from an abstract you read.</p></div></div></section><aside class="surface"><div class="sidepad"><span class="ey">Something to raise</span><h3>A subject, never a script</h3><p>Her wastewater-resistance work and your extraction-method question share a real methodological concern: how a sample-preparation choice changes what the result means.</p><div class="actions"><button>Suggest in Questions to ask</button><button>Keep in notes</button></div><div class="callout">Suggested, never inserted. Checking it in Academics updates last contact without creating an office-hours event log.</div></div></aside></div>`}
