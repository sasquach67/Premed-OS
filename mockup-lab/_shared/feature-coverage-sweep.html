<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Premed OS feature-state coverage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#211e1a;--card:#2b2722;--muted:#322e28;--line:#3c352d;--ink:#ece3d4;--mut:#a89c8c;--accent:#6fb3de;--accent-rgb:111,179,222;--good:#75b695;--warn:#e7b06a;--danger:#e68f82}*{box-sizing:border-box}body{margin:0;background:#191613;color:var(--ink);font:15px/1.42 Nunito,system-ui,sans-serif}.frame{width:min(1400px,100%);min-height:100vh;margin:auto;padding-bottom:44px;background:var(--bg)}.ban{padding:18px 24px 0;background:radial-gradient(380px 220px at 88% 0,rgba(var(--accent-rgb),.3),transparent 70%),linear-gradient(115deg,#283446 0%,#303d49 44%,#3a3730 100%)}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}.eyebrow{color:var(--accent);font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.h1{margin:4px 0 0;font:800 30px/1 'Baloo 2';letter-spacing:-.4px}.count{padding:8px 12px;border:1px solid rgba(255,255,255,.16);border-radius:11px;background:rgba(20,26,34,.5);color:rgba(255,255,255,.72);font:800 11px 'Baloo 2';white-space:nowrap}.tabs{display:flex;gap:22px;margin-top:16px;overflow:auto}.tab{position:relative;padding:9px 2px 11px;border:0;background:transparent;color:rgba(255,255,255,.58);font:700 13px 'Baloo 2';white-space:nowrap}.tab.on{color:#fff}.tab.on:after{position:absolute;right:0;bottom:0;left:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent);box-shadow:0 0 12px color-mix(in srgb,var(--accent) 60%,transparent);content:""}.notice{display:flex;gap:10px;align-items:flex-start;margin:15px 24px 0;padding:11px 13px;border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));border-radius:11px;background:color-mix(in srgb,var(--accent) 9%,var(--muted));color:var(--mut);font-size:12px;font-weight:700}.notice b{color:var(--ink)}.notice i{color:var(--accent);font-style:normal}.wrap{padding:18px 24px}.group{margin-top:23px}.group:first-child{margin-top:0}.group-hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 10px}.group-hd h2{margin:0;font:800 17px 'Baloo 2'}.group-hd span{color:var(--mut);font-size:11px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.state{min-height:154px;padding:14px;border:1px solid var(--line);border-radius:15px;background:var(--card);box-shadow:0 10px 26px -16px rgba(0,0,0,.7)}.state-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.state h3{margin:0;font:800 15px/1.15 'Baloo 2'}.where{flex:none;border-radius:999px;background:color-mix(in srgb,var(--accent) 14%,transparent);padding:3px 7px;color:var(--accent);font-size:9px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}.state p{margin:8px 0 0;color:var(--mut);font-size:11.5px;font-weight:700;line-height:1.46}.sample{display:flex;align-items:center;gap:7px;margin-top:12px;padding:8px 9px;border-radius:9px;background:var(--muted);color:var(--ink);font-size:10.5px;font-weight:800}.sample i{display:grid;flex:none;place-items:center;width:17px;height:17px;border-radius:6px;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);font-style:normal}.sample.good i{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}.sample.warn i{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}.sample.none{border:1px dashed var(--line);background:transparent;color:var(--mut)}@media(max-width:860px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.ban,.wrap{padding-left:14px;padding-right:14px}.grid{grid-template-columns:1fr}.top{align-items:flex-start}.count{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main class="frame">
    <header class="ban"><div class="top"><div><div class="eyebrow">Mockup coverage sweep</div><h1 class="h1" id="title">Academics · feature states</h1></div><div class="count" id="count"></div></div><nav class="tabs" id="tabs" aria-label="Coverage families"></nav></header>
    <div class="notice"><i>◈</i><div><b>Review-only state sheet.</b> These are not new product tabs. Each state is shown here because it otherwise lived only in the specification; its chip names the real product surface where it belongs.</div></div>
    <section class="wrap" id="groups"></section>
  </main>
  <script>
    const DATA={
      academics:{accent:'#6fb3de',rgb:'111,179,222',title:'Academics · feature states',groups:[
        ['Planning & grade decisions',[['Upward-trend detection','Grades','Your last three terms rose. Keep the evidence for Essays rather than calling it a score.','↗ GPA has risen across 3 completed terms','good'],['W-deadline awareness','Grades','A course trend and the real withdrawal window appear together, with the university context stated.','PHYS 118 trends C− · W deadline Oct 30','warn'],['Effort-to-outcome','Grades','Study time and grade pattern remain descriptive: a method question, not an effort verdict.','PHYS absorbed most study time · lowest grade',''],['Term retrospective','Grades','At term close, one view names what to carry forward and what to change next term.','Carry forward: morning recall · revise: PS problem sets',''],['Regrade window','Assignments','A returned assignment keeps its request deadline visible beside the grade, not buried in notes.','Problem set 4 · regrade closes Oct 15','warn'],['Blanking vs not-knowing','Grades','The mistake profile separates retrieval failure from missing knowledge because the next step differs.','9 of 14 losses: knew it, then blanked','']]],
        ['Daily learning loop',[['Interleaving check','Class Center','A gentle pattern notice offers a mixed queue after repeated single-class sessions.','5 CHEM sessions in a row · try a mixed queue',''],['Deadline collision','Assignments','Several class deadlines landing together appear as one dated collision, not separate alarms.','Oct 21 · 3 class commitments due','warn'],['Prerequisite decay','Class page','Current work names its older prerequisite topics before the student commits more time to the new unit.','Unit 3 builds on 3 CHEM 261 topics · refresh first',''],['Cycle stall','Class page','Covered material that never reached recall is visible as a missing stage, not a failure badge.','Unit 4 covered Sep 12 · never recalled',''],['Cram detection','Class page','The calendar context makes first exposure close to an exam legible without moralizing.','First exposure · exam in 2 days','warn'],['Re-read detection','Class page','Material opens and recall attempts are shown together so the study method is visible.','14 material opens · 2 recall sessions',''],['Topic difficulty outlier','Recall runner','A topic that needs far more repetitions gets a different-method suggestion instead of more of the same.','3× your usual reps · try explaining it aloud',''],['Material staleness','Class page','Unopened materials and unlinked notes become a quiet housekeeping state.','6 files unopened · 3 notes unlinked','']]],
        ['Rituals & honest absence',[['Weekly ritual','Shell','One weekly check-in collects the few facts that won the attention auction.','This week · 2 exams · 3 stalled topics',''],['Amnesty on return','Shell','After time away, the shell offers one no-count reset rather than a shame-inducing overdue pile.','Welcome back · clear the stale queue once','good'],['Dormancy notice','Any surface','Insufficient evidence renders a reason, never a zero chart or a fake conclusion.','Needs two more reviews before this means anything','none'],['Nudge auction','Shell','The state explains why a notice is quiet: only the highest-value interruption earns a prompt.','Held for Sunday review · not interrupting today','none'],['Term rollover ritual','Tracker','End-of-term fate is one sorted decision: retire, carry for MCAT, or carry as prerequisite.','Pause everything · 12 topics ready to sort','']]]
      ]},
      mcat:{accent:'#9c8ad8',rgb:'156,138,216',title:'MCAT · feature states',groups:[
        ['Session & plan',[['Customize your session','Session','The student can shape today’s block without replacing the deterministic plan.','Today · 90 min · swap one task',''],['Pomodoro','Session','A focus interval is a session tool, not a streak or score mechanic.','25:00 focus · 5 min break',''],['Pause, resume, end early','Session','Actual elapsed time is logged without a penalty framing when life interrupts.','Paused at 37 min · resume when ready',''],['Intake','Plan','The first plan asks for test date, study days, daily hours, background, and busy periods once.','Set study days · add finals week',''],['Phased generation','Plan','Foundation, Practice, Polish, and full-length work are legible by phase, not blended into a generic calendar.','Practice phase begins Sep 16',''],['Busy-period awareness','Plan','Known finals and travel sit in the plan as constraints before sessions are generated.','Finals week protected · no full lengths',''],['Honest unreachability','Plan','When the goal cannot fit the time and hours, the plan says what change would close the gap.','Add 1 study day or move the test date','warn'],['Full-length as a scheduled object','Plan','A full-length is placed as a contiguous block with its protected review block visible beside it.','Sat 8:00 AM · FL + 4h review reserved','']]],
        ['Content & shelf',[['Section rollups','Content','Each MCAT section shows how many categories sit at each student-confirmed mastery state.','B/B · 14 mastered · 8 reviewing',''],['ShelfItem tracking','Content / Bookshelf','Owned resources carry access, usage, and expiry context; free items do not pretend to expire.','UWorld · owned · last used today',''],['Collision-only warning','Bookshelf','An expiry appears only when it collides with a planned block that needs it.','UWorld expires before your practice block','warn'],['No affiliate, no upsell','Bookshelf','The resource shelf explicitly stays a student-owned inventory, not a store.','No sponsored placement · no purchase prompt','none'],['.apkg export','Content','Export is one-way to Anki with native note types; Premed OS never reviews the cards.','Export MCAT Mistakes.apkg · Anki owns review','']]],
        ['M2M & measured stats',[['M2M Stage 2 · Diagnose','Mistakes','A miss receives a confirmed concept and reason before it can create a drill.','Concept: amino acids · cause: misread stem',''],['Validity flags','Dashboard / Stats','A full-length records timing, breaks, sitting, and time of day before contributing to a trend.','Split across two evenings · kept, excluded from trend','warn'],['Projection recalibration','Stats','A real full-length replaces a weaker heuristic at that point in the estimate.','New FL sharpens the score interval',''],['Stamina decay','Stats','Section order can reveal a late-exam dip only after enough valid full lengths exist.','Section 4 runs 3–5 points below Section 1',''],['Score slider','Stats','Diagnostic, current, and goal are shown as three honest anchors, not a prediction gauge.','498 diagnostic · 504 current · 512 goal',''],['Consistency heatmap','Dashboard','Study consistency is visible as a calendar pattern, separate from score claims.','12 focused days in the last 21',''],['Percentiles are dated','Stats','Any percentile includes its release year and source instead of a timeless hardcoded rank.','512 · percentile year 2026','']]]
      ]},
      experiences:{accent:'#75a994',rgb:'117,169,148',title:'Experiences · shared feature states',groups:[
        ['Record reads',[['Hours, recency & continuity','Selected record','The card and its workspace distinguish cumulative time, the last real activity, and whether the commitment continues.','84h · last activity 8 days ago · active',''],['Person-scoped verifier','Selected record','Verification attaches to the person and role, rather than a generic organization contact.','Dana Brooks · program supervisor · contact saved',''],['Dated activity log','Selected record','Each entry is a dated moment with its own context; a total never fabricates a weekly pace.','Jul 12 · clinic shift · 12h','']]],
        ['Reflection mechanism',[['Prompted conversation','Reflections','A reflection starts with a specific moment and can unfold through follow-up prompts, not a blank journal box.','What did you notice that changed how you saw this?',''],['Depth without a gate','Reflections','The student can stop after one useful sentence; the system never grades depth or makes a minimum claim.','Saved after one answer · add more later','good'],['Search across your writing','Reflections','Personal writing is searchable across pillars so a remembered moment can be found later.','Search “patient autonomy” · 4 personal notes',''],['Synthesis thread','Reflections','Related moments can form a student-owned thread without inventing an application narrative.','Thread · explaining hard decisions · 3 moments','']]],
        ['Discover & honest absence',[['Discover','Discover','Opportunities are optional context, kept distinct from the student’s owned experience records.','Local opportunity · source and date shown',''],['Dormant-with-a-reason','Any experience view','Without enough logged history, pace and continuity do not pretend to be measured.','Log two dated entries to show a continuity read','none'],['No imported hour total as pace','Selected record','Legacy aggregate time remains an estimated block and is visibly excluded from weekly pace.','120h estimated history · not used for pace','none']]]
      ]},
      overview:{accent:'#6fb3de',rgb:'111,179,222',title:'Overview · feature states',groups:[
        ['Cross-pillar decisions',[['Smart next action','Overview','A recommendation names exactly why it appeared and offers a visible equivalent action.','Add a verifier · 22 logged hours have no contact',''],['Task state & priority','Tasks','Now, Soon, and Done stay a single task model; star is the only priority mechanism.','Important · draft reflection · due Friday',''],['No bar without a goal','Where I stand','A domain without a standing target shows its fact and neutral status—not a zero-progress bar.','Research · 1 project · no target set','none'],['Quarterly goal type','Quarterly goals','The student confirms check-off, cumulative metric, or period metric before any progress treatment appears.','100 clinical hours · cumulative metric · 72 complete','']]],
        ['Orientation & capture',[['Roadmap position','Roadmap','The horizontal spine makes the current milestone explicit without inventing readiness.','You are here · build sustained commitments',''],['Quick Capture','Quick Capture','A short capture routes a thought into the student’s own record with a visible destination.','Capture · “ask Dr. Shah about triage” → Story Bank',''],['Friendly empty state','Any panel','A missing collection says what one action sets up, instead of inserting demo records.','No reflections yet · save one moment after your next shift','good'],['Reduced-motion equivalent','Shell','Every animated arrival retains a stable, immediate state when motion is reduced.','Reduced motion · content shown immediately','none']]]
      ]}
    };
    const key=new URLSearchParams(location.search).get('area')||'academics',d=DATA[key]||DATA.academics;
    document.documentElement.style.setProperty('--accent',d.accent);document.documentElement.style.setProperty('--accent-rgb',d.rgb);document.getElementById('title').textContent=d.title;
    document.getElementById('tabs').innerHTML=Object.entries(DATA).map(([id,item])=>`<button class="tab ${id===key?'on':''}" onclick="location.search='?area=${id}'">${item.title.split(' · ')[0]}</button>`).join('');
    const states=d.groups.flatMap(([,rows])=>rows);document.getElementById('count').textContent=`${states.length} previously under-shown states`;
    document.getElementById('groups').innerHTML=d.groups.map(([name,rows])=>`<section class="group"><div class="group-hd"><h2>${name}</h2><span>${rows.length} states</span></div><div class="grid">${rows.map(([feature,where,body,sample,tone])=>`<article class="state"><div class="state-top"><h3>${feature}</h3><span class="where">${where}</span></div><p>${body}</p><div class="sample ${tone||''}"><i>${tone==='warn'?'!':tone==='good'?'✓':tone==='none'?'—':'◈'}</i>${sample}</div></article>`).join('')}</div></section>`).join('');
  </script>
</body>
</html>
