    html,body{background:#191613;color:var(--ink)}

    .tabs{gap:23px;margin:0;padding:0 24px;background:linear-gradient(115deg,#283446 0%,#303d49 44%,#3a3730 100%);border-color:rgba(255,255,255,.13)}.tab{padding:10px 2px 11px;color:rgba(255,255,255,.58);font-family:'Baloo 2';font-size:14px}.tab.on{color:#fff;box-shadow:inset 0 -3px var(--accent)}

    .ban{position:relative;overflow:hidden;padding:18px 24px 0;background:radial-gradient(380px 220px at 88% 0,rgba(var(--accent-rgb),.34),transparent 70%),radial-gradient(280px 180px at 8% 130%,rgba(111,192,168,.14),transparent 70%),linear-gradient(115deg,#283446 0%,#303d49 44%,#3a3730 100%)}.bantop{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:16px}.h1{margin:0;font:800 30px/1 'Baloo 2';letter-spacing:-.4px;color:#fff}.bstats{display:flex;overflow:hidden;border:1px solid rgba(255,255,255,.16);border-radius:13px;background:rgba(20,26,34,.5);backdrop-filter:blur(16px);box-shadow:inset 0 1px rgba(255,255,255,.16)}.bs{min-width:100px;padding:8px 14px;border-right:1px solid rgba(255,255,255,.12)}.bs:last-child{border:0}.bsv{font:800 18px/1 'Baloo 2';color:#fff}.bsl{margin-top:2px;color:rgba(255,255,255,.6);font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}.utabs{position:relative;z-index:1;display:flex;gap:23px;margin-top:13px;padding:0 24px;border-bottom:1px solid rgba(255,255,255,.13);overflow:auto}.ut{position:relative;white-space:nowrap;padding:10px 2px 11px;border:0;background:transparent;color:rgba(255,255,255,.58);font:700 14px 'Baloo 2'}.ut.on{color:#fff;font-weight:800}.ut.on:after{content:"";position:absolute;right:0;bottom:-1px;left:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent);box-shadow:0 0 12px color-mix(in srgb,var(--accent) 60%,transparent)}.fbar{display:flex;align-items:center;gap:9px;padding:10px 24px;border-bottom:1px solid var(--line);background:var(--paper)}.fbar .filters{display:flex;gap:7px}.fbar .filter{padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:var(--soft);color:var(--mut);font-size:11.5px;font-weight:800}.fbar .filter.on{border-color:color-mix(in srgb,var(--accent) 43%,var(--line));background:color-mix(in srgb,var(--accent) 13%,var(--soft));color:color-mix(in srgb,var(--accent) 78%,#fff)}.spacer{margin-left:auto}.btn{padd     .content{padding:15px 24px 0;grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr);gap:15px}.section-label{color:var(--dim)}.record,.summary{border-color:var(--line);background:var(--paper);box-shadow:0 10px 26px -14px rgba(0,0,0,.58)}.record{padding:13px 14px}.record:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}.badge{background:color-mix(in srgb,var(--accent) 18%,transparent);color:color-mix(in srgb,var(--accent) 72%,#fff)}.record h2,.summary h2{color:var(--ink)}.record p,.summary p,.rundown-row span{color:var(--mut)}.tag{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}.rundown-row{border-color:var(--line)}.note{border-color:color-mix(in srgb,var(--accent) 26%,var(--line));background:color-mix(in srgb,var(--accent) 9%,var(--paper))}.note .mascot{background:var(--soft);color:color-mix(in srgb,var(--accent) 75%,#fff)}.note p{color:var(--mut)}
    /* The current app's selected-record pattern: cards stay scannable above,
       while the selected entity opens into one full-width inline workspace
       beneath them. It is not a small nested accordion and not a modal. */
    .content{display:block}.content>aside{display:none}.stack{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:11px}
    .record{display:block;min-height:112px;padding:0;overflow:hidden;cursor:default;transition:border-color .15s ease,box-shadow .15s ease}
    .record:hover{transform:none}.record.open{border-color:color-mix(in srgb,var(--accent) 62%,var(--line));box-shadow:0 14px 30px -18px rgba(0,0,0,.9)}
    .record-toggle{display:grid;grid-template-columns:14px minmax(0,1fr) auto;align-items:start;gap:9px;width:100%;min-height:112px;padding:15px 16px;border:0;background:transparent;color:inherit;text-align:left;cursor:pointer}.record-toggle .badge{display:none}.record-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}.record-dot{width:10px;height:10px;margin-top:5px;border-radius:999px;background:var(--accent)}.record-toggle h2{font-size:16px}.record-toggle .tag{justify-self:end}

    body[data-pillar="clinical"] #records .record,
    body[data-pillar="clinical"] #records .add-record{aspect-ratio:1;min-height:0}
    body[data-pillar="clinical"] #records .record-toggle{position:relative;display:flex;height:100%;min-height:0;flex-direction:column;align-items:stretch;padding:16px;text-align:left}
    body[data-pillar="clinical"] #records .record-dot{width:9px;height:9px;margin:0;border-radius:3px}

      document.querySelector('.fbar').innerHTML=`<div class="filters"><button class="filter on">All ${owner}s</button><button class="filter">Mar–Jul 2026</button><button class="filter">All · Active · Ended</button></div><span class="spacer"></span><button class="btn p">＋ Log ${entryName}</button>`;
      content.className='view-shell';
      content.innerHTML=`<div class="view-head"><div><h2>Every ${entryName}, across every ${owner}</h2><p>Correct a date or duration in place. Estimated history stays visible but never feeds pace or the monthly bars.</p></div><span class="view-count">31.0 h · March</span></div><div class="panel-grid"><section class="surface"><div class="surface-head"><h3>Dated ${plural}</h3><span>month subtotals</span></div><div class="ledger"><div class="month"><b>March 2026</b><span>31.0 h</span></div><div class="entry"><time>Mar 24</time><div><b>${d.records[0][0]}</b><small>${entryName} · one useful detail saved</small></div><strong>12.0h</strong></div><div class="entry"><time>Mar 17</time><div><b>${d.records[1][0]}</b><small>${entryName} · unpacking not yet</small></div><strong>7.0h</strong></div><div class="entry"><time>Mar 08</time><div><b>${d.records[0][0]}</b><small>${entryName} · reflection saved</small></div><strong>12.0h</strong></div><div class="month"><b>Earlier history</b><span>estimated</span></div><div class="entry estimated"><time>Before 2026</time><div><b>Imported aggregate</b><small>No fabricated dates · excluded from pace</small></div><strong>120h</strong></div></div><div class="note-composer"><span>Today</span><span>${owner} · hours · what happened?</span><button>＋ Log</button></div></section><aside class="surface"><div class="surface-head"><h3>Hours over time</h3><span>Monthly · Running total</span></div><div class="bar-chart">${[32,58,44,76,63,86].map((height,i)=>`<div class="bar-col"><i style="height:${height}%"></i><span>${['Feb','Mar','Apr','May','Jun','Jul'][i]}</span></div>`).join('')}</div><div class="prompt-card"><h3>${key==='volunteering'?'Continuity leads here':'Measured only from dated entries'}</h3><p>${key==='volunteering'?'Weekly service has continued for 18 months. This describes the record; it does not grade the commitment.':'Log two dated entries before pace or continuity appears. An empty chart never means zero.'}</p></div></aside></div>`;
    }
    function renderReflections(){
      document.querySelector('.fbar').innerHTML=`<div class="filters"><button class="filter on">All ${key==='shadowing'?'physicians':key==='clinical'?'sites':'organizations'}</button><button class="filter">All states</button></div><span class="spacer"></span><span class="filter">8 threads · 3 not yet unpacked</span><button class="btn p">＋ Add reflection</button>`;
      content.className='view-shell';
      const question=key==='shadowing'?'What did you understand today that you did not understand yesterday?':key==='research'?'What changed in the project, and how did it change how you think?':key==='extracurriculars'?'What changed because you helped—and what belongs to the group, not just you?':key==='volunteering'?'What did you notice about the people or need behind the task?':'Which moment would you want to remember in an interview?';
      content.innerHTML=`<div class="view-head"><div><h2>Reflections are a conversation, not a blank journal</h2><p>One useful sentence is enough. Nothing scores depth, length, or quality, and the same records appear in Story Bank.</p></div><span class="view-count">3 not yet unpacked</span></div><div class="panel-grid"><section class="surface"><div class="surface-head"><h3>Reflection worklist</h3><span>All · Unpacked · Not yet · Deferred</span></div><div class="thread"><div class="thread-top"><h4>${d.records[0][0]} · Jul 12</h4><span class="status-chip">Not yet</span></div><p>A small moment was saved with the activity. Open it when you want to unpack it.</p></div><div class="thread"><div class="thread-top"><h4>${d.records[1][0]} · Jun 28</h4><span class="status-chip">Unpacked</span></div><p>I noticed that preparation changed the conversation more than having the perfect answer.</p></div><div class="thread synthesis"><div class="thread-top"><h4>Synthesis · explaining difficult decisions</h4><span class="status-chip">14 reflections</span></div><p>Three moments across Clinical, Shadowing, and Service are connected here without inventing an application narrative.</p></div></section><aside class="surface"><div class="prompt-card"><span class="ey">Prompted conversation</span><h3>${question}</h3><div class="prompt-box">Start with the specific moment. What happened?</div><div class="prompt-actions"><button>Save this answer</button><button>Add another thought</button><button>Stop here</button></div><p>Search across your own writing: <b>“patient autonomy” · 4 notes</b></p></div></aside></div>`;
    }
    function renderOutputs(){
      document.querySelector('.fbar').innerHTML='<div class="filters"><button class="filter on">All outputs</button><button class="filter">In motion</button><button class="filter">Deadlines</button></div><span class="spacer"></span><button class="btn p">＋ Add output</button>';
      content.className='view-shell';
      content.innerHTML=`<div class="view-head"><div><h2>The output pipeline is the research hero</h2><p>Artifacts, authorship, lineage, and external deadlines lead. Hours stay secondary and no productivity score exists.</p></div><span class="view-count">2 in motion</span></div><div class="panel-grid"><section class="surface"><div class="surface-head"><h3>Outputs</h3><span>planned → published</span></div><table class="pipeline"><thead><tr><th>Output</th><th>Venue</th><th>Deadline</th><th>Authorship</th><th>Status</th></tr></thead><tbody><tr><td><strong>Neural repair poster</strong><br><small>Derived from proposal + decision log</small></td><td>UNC OUR</td><td>Sep 18</td><td>2nd expected<br>not confirmed</td><td><span class="status-chip">Drafting</span></td></tr><tr><td><strong>Sleep abstract</strong><br><small>Internal deadline Aug 28</small></td><td>SfN</td><td>Sep 05</td><td>Co-author confirmed</td><td><span class="status-chip">Review</span></td></tr><tr><td><strong>DPPH proposal</strong></td><td>Morris Lab</td><td>—</td><td>Student lead</td><td><span class="status-chip">Complete</span></td></tr></tbody></table></section><aside class="surface"><div class="prompt-card"><span class="ey">Hand me the sources</span><h3>Poster material, assembled</h3><p>6 lab notes · 2 decisions · 4 papers · 1 prior presentation. Premed OS hands these over; you write.</p><div class="prompt-box">Authorship expectation has not been confirmed for the poster. Record the conversation while it is still easy to have.</div></div></aside></div>`;
    }
    function renderLabNotes(){
      document.querySelector('.fbar').innerHTML='<div class="filters"><button class="filter on">All projects</button><button class="filter">Decisions</button><button class="filter">Anomalies</button></div><span class="spacer"></span><button class="btn p">＋ Add note</button>';
      content.className='view-shell';
      content.innerHTML=`<div class="view-head"><div><h2>A retrieval layer—not an electronic lab notebook</h2><p>Decisions, results, anomalies, and blockers stay findable. Raw measurements, protocols, files, and replicates remain in LabArchives.</p></div><span class="view-count">Last note · yesterday</span></div><div class="panel-grid"><section class="surface"><div class="surface-head"><h3>Recent lab notes</h3><span>Search “extract B”</span></div><div class="thread"><div class="thread-top"><h4>Jul 13 · Decision</h4><span class="status-chip">Significant</span></div><p>Changed the extraction window from 24h to 18h after the baseline drift appeared. ELN link saved.</p></div><div class="thread"><div class="thread-top"><h4>Jul 11 · Anomaly</h4><span class="status-chip">Morris Lab</span></div><p>Extract B produced a lower signal than the two prior runs. Check storage conditions before repeating.</p></div><div class="thread"><div class="thread-top"><h4>Jul 08 · Blocker</h4><span class="status-chip">Resolved</span></div><p>Plate reader unavailable; moved the run and recorded why the output date changed.</p></div><div class="note-composer"><span>Today</span><span>Decision, result, anomaly, or blocker</span><button>＋ Log</button></div></section><aside class="surface"><div class="prompt-card"><span class="ey">Last time I ran this</span><h3>Extract B · three prior notes</h3><p>Jun 14 · Jun 22 · Jul 11, in order. This is deterministic retrieval over your summaries.</p><div class="prompt-box">LabArchives holds the experiment. Premed OS keeps the reason a decision changed.</div></div></aside></div>`;
    }
    function renderInitiatives(){
      document.querySelector('.fbar').innerHTML='<div class="filters"><button class="filter on">Active</button><button class="filter">All organizations</button></div><span class="spacer"></span><button class="btn p">＋ Add initiative</button>';
      content.className='view-shell';
      content.innerHTML=`<div class="view-head"><div><h2>Concrete contributions across organizations</h2><p>An initiative is a project with an outcome and handoff—not a leadership title and not a session log.</p></div><span class="view-count">3 initiatives</span></div><div class="panel-grid"><section class="surface"><div class="surface-head"><h3>In motion</h3><span>cross-organization ledger</span></div><div class="initiative"><h4>Fall speaker series · Carolina Neuroscience Club</h4><p>Booked two speakers · room request pending · handoff notes started</p><div class="progress-line"><i style="width:64%"></i></div></div><div class="initiative"><h4>Spring supply drive · MEDLIFE at UNC</h4><p>312 kits assembled with 18 volunteers · outcome note ready</p><div class="progress-line"><i style="width:100%"></i></div></div><div class="initiative"><h4>First-year rehearsal guide · UNC Pep Band</h4><p>One sentence is enough to start; add the outcome when it exists.</p><div class="progress-line"><i style="width:28%"></i></div></div></section><aside class="surface"><div class="prompt-card"><span class="ey">Contribution, not rank</span><h3>What changed because you helped?</h3><p>The work, collaborators, result, and handoff make the record. A title never substitutes for them.</p></div></aside></div>`;
    }
    function renderDiscover(){
      document.querySelector('.fbar').innerHTML='<div class="filters"><button class="filter on">All opportunities</button><button class="filter">This month</button><button class="filter">Saved</button></div><span class="spacer"></span><button class="filter">Sources & dates</button>';
      content.className='view-shell';
      const items=key==='research'?[['UNC OUR Research Expo','Presentation venue · abstracts due Sep 18','UNC Office for Undergraduate Research · checked Aug 2026'],['Neuroscience summer grant','Student research funding · spring cycle','UNC OUR · checked Aug 2026'],['Morris Lab undergraduate opening','Wet lab · recruiting status dated','Department source · checked Aug 2026']]:[['Carolina Blood Drive','Campus event · Aug 29 · Student Union','Heel Life · checked Aug 2026'],['MEDLIFE mobile clinic interest meeting','Organization event · Sep 04','Heel Life · checked Aug 2026'],['Carolina Neuroscience Club','Organization profile · upcoming events','Heel Life · checked Aug 2026']];
      content.innerHTML=`<div class="view-head"><div><h2>Optional context, separate from what you own</h2><p>Every opportunity shows its source and checked date. Saving is not applying, joining, or creating an experience record.</p></div><span class="view-count">Sourced · dated</span></div><div class="panel-grid"><section class="surface"><div class="surface-head"><h3>${key==='research'?'Venues, grants, events, and labs':'Organizations and events'}</h3><span>Discover</span></div>${items.map(item=>`<div class="opportunity"><div><h4>${item[0]}</h4><p>${item[1]}</p><span class="source-line">${item[2]}</span></div><button class="filter">Save</button></div>`).join('')}</section><aside class="surface"><div class="prompt-card"><span class="ey">Boundary</span><h3>This is not an application tracker</h3><p>No “applied,” “rejected,” response rate, or opportunity score. Once you actually join, create the owned record in the first sub-tab.</p></div></aside></div>`;
    }
    if(requestedView==='empty') renderEmpty();
    else if(activeSlug===primarySlug) renderPrimary();
    else if(['shifts','events','visits'].includes(activeSlug)) renderLedger();
    else if(activeSlug==='reflections') renderReflections();
    else if(activeSlug==='outputs') renderOutputs();
    else if(activeSlug==='lab-notes') renderLabNotes();
    else if(activeSlug==='initiatives') renderInitiatives();
    else if(activeSlug==='discover') renderDiscover();
    else renderPrimary();
  </script>
</body>
</html>
