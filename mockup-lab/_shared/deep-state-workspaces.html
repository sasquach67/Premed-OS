<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Premed OS deep state workspaces</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#201d19;--surface:#2a2621;--raised:#302b25;--quiet:#24211d;--line:#40382f;--ink:#f0e6d8;--mut:#aa9d8c;--dim:#796f62;--pri:#6fb3de;--pri-rgb:111,179,222;--good:#78b58e;--warn:#e2aa68;--bad:#d88076;--violet:#9b89d3}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#181512;color:var(--ink);font:15px/1.42 Nunito,system-ui,sans-serif}button,input,textarea,select{font:inherit}.frame{width:min(1420px,100%);min-height:100vh;margin:auto;background:var(--bg)}
    .hero{position:relative;padding:24px 28px 0;overflow:hidden;background:radial-gradient(520px 260px at 90% -20%,rgba(var(--pri-rgb),.26),transparent 68%),linear-gradient(125deg,#273649,#323c43 52%,#3b352d)}
    .hero:after{position:absolute;inset:auto 0 0;height:1px;background:rgba(255,255,255,.08);content:""}.crumb{color:var(--pri);font-size:10px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}.hero-row{display:flex;align-items:flex-end;justify-content:space-between;gap:22px}.h1{margin:5px 0 0;font:800 31px/1.06 "Baloo 2";letter-spacing:-.45px}.sub{max-width:720px;margin:7px 0 0;color:rgba(255,255,255,.65);font-size:12.5px;font-weight:700}.status{display:flex;gap:8px;align-items:center;padding:8px 11px;border:1px solid rgba(255,255,255,.14);border-radius:11px;background:rgba(13,17,22,.36);color:rgba(255,255,255,.72);font-size:11px;font-weight:800;white-space:nowrap}.status i{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px rgba(120,181,142,.12)}
    .tabs{display:flex;gap:24px;margin-top:19px;overflow:auto}.tab{position:relative;padding:9px 1px 12px;border:0;background:transparent;color:rgba(255,255,255,.55);font:700 13px "Baloo 2";white-space:nowrap}.tab.on{color:#fff}.tab.on:after{position:absolute;right:0;bottom:0;left:0;height:3px;border-radius:3px 3px 0 0;background:var(--pri);content:""}
    .wrap{padding:20px 28px 38px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}.toolbar h2{margin:0;font:800 20px "Baloo 2"}.toolbar p{margin:2px 0 0;color:var(--mut);font-size:11.5px;font-weight:700}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);border-radius:10px;background:var(--raised);padding:8px 11px;color:var(--ink);font-size:11px;font-weight:900}.btn.primary{border-color:transparent;background:var(--pri);color:#10212d}.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);gap:14px}.surface{border:1px solid var(--line);border-radius:17px;background:var(--surface);box-shadow:0 16px 36px -26px #000;overflow:hidden}.surface-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:15px 16px 10px}.surface-hd h3{margin:0;font:800 16px "Baloo 2"}.surface-hd p{margin:3px 0 0;color:var(--mut);font-size:11px;font-weight:700}.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;background:rgba(var(--pri-rgb),.12);padding:4px 8px;color:var(--pri);font-size:9px;font-weight:900;letter-spacing:.05em;text-transform:uppercase}.body{padding:0 16px 16px}.stack{display:grid;gap:9px}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--quiet)}.row strong{display:block;font:800 13px "Baloo 2"}.row small{display:block;margin-top:2px;color:var(--mut);font-size:10.5px;font-weight:700}.row .meta{text-align:right;color:var(--mut);font-size:10px;font-weight:800}.row.warn{border-color:color-mix(in srgb,var(--warn) 42%,var(--line));background:color-mix(in srgb,var(--warn) 7%,var(--quiet))}.row.good{border-color:color-mix(in srgb,var(--good) 38%,var(--line))}.row.dormant{border-style:dashed;color:var(--mut)}
    .signal{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.signal:first-child{border-top:0}.sig-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:rgba(var(--pri-rgb),.12);color:var(--pri);font-weight:900}.signal strong{display:block;font-size:12px}.signal span{display:block;color:var(--mut);font-size:10.5px;font-weight:700}.quiet-link{border:0;background:none;color:var(--pri);font-size:10px;font-weight:900}.metric{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric>div{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--quiet)}.metric b{display:block;font:800 21px "Baloo 2"}.metric span{color:var(--mut);font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
    .meter{height:6px;margin-top:8px;border-radius:99px;background:#1d1a17;overflow:hidden}.meter i{display:block;height:100%;border-radius:inherit;background:var(--pri)}.callout{display:flex;gap:11px;padding:12px;border:1px solid rgba(var(--pri-rgb),.26);border-radius:12px;background:rgba(var(--pri-rgb),.08)}.callout i{display:grid;flex:none;place-items:center;width:30px;height:30px;border-radius:10px;background:rgba(var(--pri-rgb),.14);color:var(--pri);font-style:normal}.callout strong{display:block;font-size:12px}.callout p{margin:2px 0 0;color:var(--mut);font-size:10.5px;font-weight:700}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{padding:10px 11px;border:1px solid var(--line);border-radius:11px;background:var(--quiet)}.field label{display:block;color:var(--dim);font-size:8.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.field b{display:block;margin-top:4px;font-size:12px}.check{display:flex;align-items:center;gap:9px}.check i{display:grid;place-items:center;width:19px;height:19px;border:1px solid var(--line);border-radius:6px;color:var(--good);font-style:normal}.check.done i{border-color:var(--good);background:rgba(120,181,142,.14)}
    .timer{text-align:center;padding:22px 16px}.timer .clock{font:800 58px/1 "Baloo 2";letter-spacing:-2px}.timer .task{margin-top:8px;font:800 16px "Baloo 2"}.timer .hint{margin-top:3px;color:var(--mut);font-size:11px;font-weight:700}.timer-actions{display:flex;justify-content:center;gap:9px;margin-top:18px}.timeline{position:relative;display:grid;gap:12px;padding-left:19px}.timeline:before{position:absolute;top:9px;bottom:9px;left:6px;width:2px;background:var(--line);content:""}.step{position:relative;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--quiet)}.step:before{position:absolute;top:16px;left:-18px;width:9px;height:9px;border:2px solid var(--surface);border-radius:50%;background:var(--dim);content:""}.step.on:before{background:var(--pri);box-shadow:0 0 0 3px rgba(var(--pri-rgb),.12)}.step strong{font-size:12px}.step p{margin:3px 0 0;color:var(--mut);font-size:10.5px;font-weight:700}.goal{padding:13px;border:1px solid var(--line);border-radius:13px;background:var(--quiet)}.goal-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.goal strong{font-size:12px}.goal-type{color:var(--mut);font-size:9px;font-weight:900;text-transform:uppercase}.goal .value{margin-top:8px;font:800 20px "Baloo 2"}.goal.done{border-color:color-mix(in srgb,var(--good) 38%,var(--line))}.strike{text-decoration:line-through;color:var(--mut)}.source{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);color:var(--dim);font-size:9.5px;font-weight:800}
    @media(max-width:800px){.grid,.split{grid-template-columns:1fr}.hero-row{align-items:flex-start}.status{display:none}.metric{grid-template-columns:1fr}.wrap,.hero{padding-left:16px;padding-right:16px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
  </style>
</head>
<body>
  <main class="frame"><header class="hero"><div class="hero-row"><div><div class="crumb" id="crumb"></div><h1 class="h1" id="title"></h1><p class="sub" id="subtitle"></p></div><div class="status"><i></i><span id="status"></span></div></div><nav class="tabs" id="tabs"></nav></header><section class="wrap"><div class="toolbar"><div><h2 id="view-title"></h2><p id="view-copy"></p></div><div class="actions" id="actions"></div></div><div id="content"></div></section></main>
  <script>
    const q=new URLSearchParams(location.search),area=q.get('area')||'academics',view=q.get('view')||'learning-signals';
    const PAGES={
      academics:{color:'#6fb3de',rgb:'111,179,222',crumb:'Academics · daily + planning',title:'Learn from the whole term, not one isolated grade.',subtitle:'Study behavior, deadlines, course evidence, and end-of-term decisions stay attached to the surface that owns them.',status:'Student evidence only',tabs:[['learning-signals','Learning signals'],['grade-decisions','Grade decisions'],['term-rollover','Term rollover']]},
      mcat:{color:'#9b89d3',rgb:'155,137,211',crumb:'MCAT · measured preparation',title:'A plan you can actually sit down and follow.',subtitle:'Session controls, honest constraints, full-length validity, and test-day logistics are visible without turning preparation into a score game.',status:'No invented prediction',tabs:[['session','Session'],['test-day','Test Day'],['validity','Full-length validity']]},
      overview:{color:'#6fb3de',rgb:'111,179,222',crumb:'Overview · quarterly goals',title:'Different goals deserve different progress language.',subtitle:'The student confirms the goal type. Premed OS connects only to measured records it can actually attribute.',status:'Student confirms the type',tabs:[]}
    };
    const d=PAGES[area]||PAGES.academics;document.documentElement.style.setProperty('--pri',d.color);document.documentElement.style.setProperty('--pri-rgb',d.rgb);crumb.textContent=d.crumb;title.textContent=d.title;subtitle.textContent=d.subtitle;status.textContent=d.status;
    tabs.hidden=area==='overview';
    tabs.innerHTML=d.tabs.map(([slug,label])=>`<button class="tab ${slug===view?'on':''}" onclick="location.search='?area=${area}&view=${slug}'">${label}</button>`).join('');
    const row=(title,copy,meta='',tone='')=>`<div class="row ${tone}"><div><strong>${title}</strong><small>${copy}</small></div><div class="meta">${meta}</div></div>`;
    const header=(title,copy,chip='')=>`<div class="surface-hd"><div><h3>${title}</h3><p>${copy}</p></div>${chip?`<span class="chip">${chip}</span>`:''}</div>`;
    const surface=(title,copy,body,chip='')=>`<article class="surface">${header(title,copy,chip)}<div class="body">${body}</div></article>`;
    const setHead=(title,copy,buttons='')=>{document.getElementById('view-title').textContent=title;document.getElementById('view-copy').textContent=copy;document.getElementById('actions').innerHTML=buttons};
    const callout=(title,copy)=>`<div class="callout"><i>◈</i><div><strong>${title}</strong><p>${copy}</p></div></div>`;
    function renderAcademics(){
      if(view==='grade-decisions'){
        setHead('Grade decisions','Signals stay descriptive and open the relevant next action.',`<button class="btn">Open grade ledger</button>`);
        content.innerHTML=`<div class="grid">${surface('CHEM 262 · evidence', 'A trend is context, not a verdict.',`<div class="metric"><div><b>B−</b><span>current</span></div><div><b>8.4h</b><span>study logged</span></div><div><b>Oct 30</b><span>W deadline</span></div></div><div class="stack" style="margin-top:10px">${row('Upward pattern across three completed terms','Keep this evidence available for reflection; do not turn it into a score.','View terms','good')}${row('CHEM absorbed the most study time and remains the lowest grade','A method question, not an effort verdict.','Review methods','warn')}${row('Problem set 4 regrade window','Returned work keeps the real request deadline attached.','Closes Oct 15','warn')}</div>`,'Measured')}${surface('Why points were lost','Blanking and missing knowledge lead to different study work.',`${row('Retrieval failure','You knew it during review, then blanked under time.','9 items')}${row('Knowledge gap','The underlying concept was not yet stable.','5 items')}${callout('Try a different next pass','Rehearse retrieval under a small time constraint before rereading.')}`,'Student-coded')}</div>`;
      }else if(view==='term-rollover'){
        setHead('End-of-term rollover','One bounded ritual sorts what happens to every class and topic.',`<button class="btn primary">Save rollover</button>`);
        content.innerHTML=`<div class="grid">${surface('Pause the term','Nothing carries forward until you choose its fate.',`<div class="stack">${row('CHEM 262','Final grade recorded · 18 topics','Ready to sort')}${row('NSCI 175','Final grade recorded · 12 topics','Ready to sort')}${row('ENGL 105','Portfolio complete · writing materials','Ready to sort')}</div><div class="source">No automatic archive: the student sees what will become dormant.</div>`,'3 classes')}${surface('Sort the useful remainder','The three explicit destinations prevent a permanent overdue pile.',`<div class="stack">${row('Retire with the class','Course-specific material that no longer needs active attention.','21 topics')}${row('Carry for MCAT','Confirmed overlap with a future MCAT content category.','6 topics')}${row('Carry as prerequisite','Foundational material used by a planned course.','3 topics')}</div>${callout('Amnesty on return','If you come back after time away, clear the stale queue once—without a penalty or shame count.')}`,'12 decisions')}</div>`;
      }else{
        setHead('Learning signals','Quiet observations sit beside the class work that produced them.',`<button class="btn">Open Class Center</button>`);
        const signals=[['⇄','Interleaving check','Five CHEM sessions in a row · offer a mixed queue'],['↺','Cycle stall','Unit 4 was covered Sep 12 but never reached recall'],['⌁','Prerequisite decay','This unit depends on three CHEM 261 topics'],['◷','Cram context','First exposure is two days before the exam'],['≋','Reread pattern','14 material opens · only 2 recall attempts'],['△','Topic outlier','Three times your usual repetitions · change method'],['□','Material housekeeping','6 files unopened · 3 notes still unlinked']];
        content.innerHTML=`<div class="grid">${surface('CHEM 262 · current signals','These are invitations to inspect, never penalties.',signals.map(([i,t,c])=>`<div class="signal"><div class="sig-icon">${i}</div><div><strong>${t}</strong><span>${c}</span></div><button class="quiet-link">Open</button></div>`).join(''),'Class-owned')}${surface('This week’s attention auction','Only the highest-value interruption becomes a prompt.',`${row('Deadline collision','Oct 21 holds three class commitments.','Review day','warn')}${row('Weekly ritual','Two exams and three stalled topics are ready for Sunday review.','Sunday')}${row('Not enough evidence','Topic difficulty needs two more recall attempts.','No chart','dormant')}${callout('No permanent alert pile','Lower-value signals stay in their owner surface until the weekly ritual.')}`,'Quiet by default')}</div>`;
      }
    }
    function renderMcat(){
      if(view==='test-day'){
        setHead('Test Day','A phase-gated Dashboard panel—not an eighth MCAT tab.',`<button class="btn primary">Open logistics</button>`);
        content.innerHTML=`<div class="grid">${surface('Three phases, one quiet panel','Only the current phase receives visual emphasis.',`<div class="timeline"><div class="step"><strong>1 · Register</strong><p>Official registration link, saved date, testing center, and dated policy note. No seat availability claim.</p></div><div class="step on"><strong>2 · Logistics</strong><p>Arrival time, identification, route, food, break plan, and the void rule written before exam day.</p></div><div class="step"><strong>3 · After</strong><p>Record actual test completion and the score-release date from the official source.</p></div></div>`,'Current · Logistics')}${surface('Saturday · August 22','Everything needed for the day fits without countdown theater.',`<div class="split"><div class="field"><label>Arrival</label><b>7:15 AM</b></div><div class="field"><label>Center</label><b>Durham Prometric</b></div><div class="field"><label>Identification</label><b>Government photo ID</b></div><div class="field"><label>Route</label><b>Leave by 6:28 AM</b></div></div><div class="stack" style="margin-top:10px"><div class="check done"><i>✓</i><b>Lunch and water packed</b></div><div class="check done"><i>✓</i><b>Void rule written in advance</b></div><div class="check"><i></i><b>Confirm official center instructions</b></div></div><div class="source">Source checked Aug 14, 2026 · AAMC registration guidance</div>`,'Factual + dated')}</div>`;
      }else if(view==='validity'){
        setHead('Full-length validity','The trend uses only sittings that mean what the chart says they mean.',`<button class="btn">Log full length</button>`);
        content.innerHTML=`<div class="grid">${surface('Full-length record','Context is saved before the result contributes to a trend.',`<div class="split"><div class="field"><label>Score</label><b>504</b></div><div class="field"><label>Source</label><b>AAMC FL 2</b></div><div class="field"><label>Sitting</label><b>One sitting</b></div><div class="field"><label>Timing</label><b>Standard</b></div><div class="field"><label>Breaks</label><b>Standard</b></div><div class="field"><label>Start time</label><b>8:04 AM</b></div></div>`,'Valid trend point')}${surface('What the evidence can say','Measured patterns remain separate from the student’s goal.',`${row('Score anchors','498 diagnostic · 504 current · 512 goal','Not a prediction')}${row('Late-section stamina','Section 4 runs below Section 1 across three valid sittings.','Measured')}${row('Split sitting excluded','Completed over two evenings; retained as a record, not a trend point.','Reason shown','dormant')}${row('Percentile context','Release year and source stay attached to the number.','2026 source')}`,'3 valid sittings')}</div>`;
      }else{
        setHead('Today’s session','Customize the block, focus, capture, and close with actual time.',`<button class="btn">Customize</button><button class="btn primary">Start focus</button>`);
        content.innerHTML=`<div class="grid">${surface('Focus block','The plan supplies the work; the student controls today’s reality.',`<div class="timer"><div class="clock">24:18</div><div class="task">Amino acids · mixed passage set</div><div class="hint">25-minute focus · notifications quiet</div><div class="timer-actions"><button class="btn">Pause</button><button class="btn">End early</button></div></div><div class="split"><div class="field"><label>Quick mistake</label><b>Misread the charge state</b></div><div class="field"><label>Quick note</label><b>Review pKa comparison</b></div></div>`,'In progress')}${surface('Session plan','A deterministic plan can be adjusted without becoming an AI black box.',`<div class="stack">${row('Amino acids passage set','Official practice · 25 min','Now','good')}${row('Review last set','Classify misses before drilling.','20 min')}${row('CARS timed passage','Owned resource · actual time logged.','25 min')}</div>${callout('Life interrupted the block?','Pause, resume, or end early. The summary logs actual elapsed time without a penalty.')}`,'90 min planned')}</div>`;
      }
    }
    function renderOverview(){
      if(view==='goal-editor'){
        setHead('New quarterly goal','The student confirms the behavior before Premed OS chooses a visual treatment.',`<button class="btn primary">Save goal</button>`);
        content.innerHTML=`<div class="grid">${surface('Describe the goal','Plain language remains the source of truth.',`<div class="field"><label>Goal</label><b>Complete the third personal statement draft</b></div><div class="stack" style="margin-top:10px">${row('Check-off','One finish line; complete or not complete.','Selected','good')}${row('Cumulative metric','Progress comes from an attributable lifetime total.','Example · 100 clinical hours')}${row('Period metric','Progress resets over a defined window.','Example · 150 questions/week')}</div>`,'Confirm type')}${surface('Connection','AI may suggest a type, but the student confirms it.',`${callout('Suggested: Check-off','“Complete draft 3” names one finish line rather than a numeric target.')}${row('Connect to tracker','Optional only when a real record supplies the measurement.','Not connected')}${row('Manual completion','The student marks the goal complete.','Available')}${row('No percentage','Check-off goals never invent 60% from “draft 3.”','Protected','dormant')}`,'Explainable')}</div>`;
      }else if(view==='no-data'){
        setHead('Honest absence','No goal, no bar. No measured history, no pace.',``);
        content.innerHTML=`<div class="grid">${surface('Where I stand','Facts remain visible while unsupported progress stays dormant.',`${row('School List','8 schools saved','No standing target','dormant')}${row('Activities','3 active organizations','No standing target','dormant')}${row('Research','1 active project','No standing target','dormant')}${row('Clinical','72 logged hours','Goal · 100h','good')}`,'No zero bars')}${surface('Friendly empty state','A single next action explains what it sets up.',`${callout('No quarterly goals yet','Add one check-off or measured goal to keep the next three months visible.')}${row('Reduced motion','The complete stable surface appears immediately.','No delayed meaning')}`,'One-liner')}</div>`;
      }else{
        setHead('Quarterly goals','Type determines the interaction—not a guessed universal percentage.',`<button class="btn primary">Add goal</button>`);
        content.innerHTML=`<div class="grid" style="grid-template-columns:minmax(0,1fr)">${surface('October–December','Three different goal types, three honest treatments.',`<div class="stack"><div class="goal"><div class="goal-top"><strong>100 clinical hours</strong><span class="goal-type">Cumulative metric</span></div><div class="value">72 / 100h</div><div class="meter"><i style="width:72%"></i></div><div class="source">Connected to dated Clinical shifts</div></div><div class="goal done"><div class="goal-top"><strong class="strike">Submit personal statement draft 3</strong><span class="goal-type">Check-off</span></div><div class="value">✓ Complete</div><div class="source">Marked complete by Andy · Aug 13</div></div><div class="goal"><div class="goal-top"><strong>150 practice questions each week</strong><span class="goal-type">Period metric</span></div><div class="value">132 / 150</div><div class="meter"><i style="width:88%;background:var(--violet)"></i></div><div class="source">Current week · connected to MCAT result logs</div></div></div>`,'Student-confirmed')}</div>`;
      }
    }
    if(area==='mcat')renderMcat();else if(area==='overview')renderOverview();else renderAcademics();
  </script>
</body>
</html>
