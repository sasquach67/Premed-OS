<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MCAT tab concepts</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#211e1a;--card:#2b2722;--fg:#ece3d4;--mut:#a89c8c;--dim:#7c7264;--bd:#3c352d;--soft:#322e28;--mcat:#8c7bd4;--good:#6fc0a8;--warn:#e7b06a}*{box-sizing:border-box}body{margin:0;background:#191613;color:var(--fg);font:15px/1.42 Nunito,sans-serif}.frame{width:min(1400px,100%);min-height:100vh;margin:auto;background:var(--bg);padding-bottom:40px}button{font:inherit;border:0;cursor:pointer}.ban{padding:18px 24px 0;background:radial-gradient(380px 220px at 88% 0,rgba(140,123,212,.34),transparent 70%),linear-gradient(115deg,#292847 0%,#343248 44%,#3a3730 100%)}.bantop{display:flex;justify-content:space-between;align-items:center;gap:16px}.h1{font:800 30px/1 'Baloo 2';color:#fff}.bstats{display:flex;overflow:hidden;border:1px solid rgba(255,255,255,.16);border-radius:13px;background:rgba(20,19,33,.5);backdrop-filter:blur(16px)}.bs{min-width:84px;padding:8px 14px;border-right:1px solid rgba(255,255,255,.12)}.bs:last-child{border:0}.bsv{font:800 18px/1 'Baloo 2';color:#fff}.bsl{margin-top:2px;color:rgba(255,255,255,.6);font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}.utabs{display:flex;gap:23px;margin-top:18px;padding:0 24px;border-bottom:1px solid rgba(255,255,255,.13);overflow:auto}.ut{position:relative;white-space:nowrap;padding:10px 2px 11px;background:transparent;color:rgba(255,255,255,.58);font:700 14px 'Baloo 2'}.ut.on{color:#fff}.ut.on:after{content:"";position:absolute;right:0;bottom:-1px;left:0;height:3px;border-radius:3px 3px 0 0;background:var(--mcat)}.fbar{display:flex;align-items:center;gap:9px;padding:10px 24px;border-bottom:1px solid var(--bd);background:var(--card)}.control{padding:6px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--soft);color:var(--mut);font-size:11px;font-weight:800}.control b{font-family:'Baloo 2';color:var(--fg)}.spacer{margin-left:auto}.btn{padding:7px 11px;border-radius:9px;font:800 11px 'Baloo 2'}.btn.p{background:var(--mcat);color:#211a39}.btn.g{border:1px solid var(--bd);background:var(--soft);color:var(--mut)}.wrap{padding:15px 24px}.workspace{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(285px,.65fr);gap:15px}.card{overflow:hidden;border:1px solid var(--bd);border-radius:16px;background:var(--card);box-shadow:0 10px 26px -14px rgba(0,0,0,.58)}.hd{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:14px 16px 8px}.ti{font:800 16px 'Baloo 2'}.ey{color:#cfc4f6;font-size:9px;font-weight:900;letter-spacing:.09em;text-transform:uppercase}.sub{color:var(--dim);font-size:10px;font-weight:700}.bd{padding:3px 16px 16px}.side{display:grid;align-content:start;gap:15px}.focus{padding:12px;border:1px solid color-mix(in srgb,var(--mcat) 31%,var(--bd));border-radius:12px;background:linear-gradient(110deg,color-mix(in srgb,var(--mcat) 14%,var(--soft)),var(--soft))}.focus b{font:800 15px 'Baloo 2'}.focus p{margin:3px 0 0;color:var(--mut);font-size:10px;font-weight:700}.rows{display:grid;gap:6px;margin-top:10px}.row{display:grid;grid-template-columns:28px 1fr auto;gap:9px;align-items:center;padding:9px 0;border-top:1px solid var(--bd)}.dot{display:grid;place-items:center;width:25px;height:25px;border-radius:8px;background:color-mix(in srgb,var(--mcat) 18%,transparent);color:#ded6ff;font:800 11px 'Baloo 2'}.row b{font:700 11px 'Baloo 2'}.row span{display:block;margin-top:1px;color:var(--dim);font-size:9px;font-weight:700}.chip{padding:4px 7px;border-radius:999px;background:color-mix(in srgb,var(--mcat) 15%,transparent);color:#cfc4f6;font:800 9px 'Baloo 2';font-style:normal}.metric{padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--soft)}.number{margin:6px 0 2px;color:#ded6ff;font:800 33px/1 'Baloo 2'}.metric p{margin:0;color:var(--mut);font-size:10px;font-weight:700}.mini{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}.mini div{padding:8px;border:1px solid var(--bd);border-radius:9px;background:var(--card)}.mini b{display:block;font:800 15px/1 'Baloo 2'}.mini span{color:var(--dim);font-size:8px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}.note{margin-top:12px;padding:10px;border:1px solid color-mix(in srgb,var(--mcat) 28%,var(--bd));border-radius:10px;background:color-mix(in srgb,var(--mcat) 8%,var(--card));color:var(--mut);font-size:10px;font-weight:700}.note b{color:var(--fg);font-family:'Baloo 2'}.heat{display:grid;grid-template-columns:96px repeat(4,1fr);gap:4px;align-items:center;margin-top:12px}.heat span{color:var(--dim);font-size:9px;font-weight:800}.cell{height:20px;border-radius:5px;background:#40354b}.cell.a{background:#655276}.cell.b{background:#8968a1}.cell.c{background:#ad78b8}.chart{position:relative;height:160px;margin-top:10px;border-left:1px solid var(--bd);border-bottom:1px solid var(--bd);background:repeating-linear-gradient(to bottom,transparent 0 39px,rgba(255,255,255,.05) 40px)}.line{position:absolute;left:8%;right:8%;top:38%;height:2px;background:var(--mcat);transform:rotate(-7deg);transform-origin:left;box-shadow:0 0 12px rgba(140,123,212,.65)}.point{position:absolute;width:11px;height:11px;border:2px solid var(--mcat);border-radius:50%;background:var(--card)}.p1{left:9%;bottom:22%}.p2{left:46%;bottom:35%}.p3{right:9%;bottom:48%}.goal{position:absolute;right:0;top:14%;color:var(--warn);font:800 10px 'Baloo 2'}.bars{display:grid;gap:8px;margin-top:10px}.barrow{display:grid;grid-template-columns:35px 1fr 60px;gap:7px;align-items:center;color:var(--mut);font-size:9px;font-weight:800}.bar{height:8px;overflow:hidden;border-radius:99px;background:#272420}.bar i{display:block;height:100%;border-radius:99px;background:var(--mcat)}.chat{display:grid;gap:9px;margin-top:8px}.bubble{max-width:88%;padding:10px;border:1px solid var(--bd);border-radius:11px;background:var(--soft);color:var(--mut);font-size:10px;font-weight:700}.bubble.me{justify-self:end;border-color:color-mix(in srgb,var(--mcat) 32%,var(--bd));background:color-mix(in srgb,var(--mcat) 12%,var(--soft));color:var(--fg)}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.reply{padding:5px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--soft);color:var(--mut);font:700 10px 'Baloo 2'}.proposal{margin-top:10px;padding:10px;border:1px solid color-mix(in srgb,var(--good) 34%,var(--bd));border-radius:10px;background:color-mix(in srgb,var(--good) 10%,var(--soft));font-size:10px;color:var(--mut);font-weight:700}.proposal b{color:var(--fg);font-family:'Baloo 2'}@media(max-width:850px){.workspace{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr}.side>.card:last-child{grid-column:1/-1}.bstats .bs:nth-child(n+3){display:none}}@media(max-width:560px){.ban,.fbar,.wrap{padding-left:14px;padding-right:14px}.bstats{display:none}.utabs{padding:0 4px;gap:16px}.spacer{display:none}.side{grid-template-columns:1fr}.heat{grid-template-columns:76px repeat(4,1fr)}}
</style></head><body><main class="frame"><header class="ban"><div class="bantop"><div class="h1">MCAT</div><div class="bstats"><div class="bs"><div class="bsv">118</div><div class="bsl">days to exam</div></div><div class="bs"><div class="bsv">504</div><div class="bsl">latest FL</div></div><div class="bs"><div class="bsv">5 days</div><div class="bsl">study this week</div></div></div></div><nav class="utabs" id="tabs"></nav></header><div class="fbar"><span class="control" id="filter"></span><span class="control" id="subfilter"></span><span class="spacer"></span><button class="btn g" id="secondary"></button><button class="btn p" id="primary"></button></div><section class="wrap"><div class="workspace"><article class="card"><div class="hd"><div><div class="ey" id="ey"></div><div class="ti" id="title"></div></div><span class="sub" id="status"></span></div><div class="bd" id="main"></div></article><aside class="side"><article class="card"><div class="hd"><div class="ti" id="metricLabel"></div><span class="sub">measured</span></div><div class="bd"><div class="metric"><div class="number" id="number"></div><p id="metricCopy"></p><div class="mini" id="mini"></div></div><div class="note" id="note"></div></div></article><article class="card"><div class="hd"><div class="ti" id="railTitle"></div><span class="sub" id="railTag"></span></div><div class="bd" id="rail"></div></article></aside></div></section></main><script>

he inputs support one—not certainty dressed up as a score.</p></div><div class="chart"><span class="goal">Goal · 512</span><i class="line"></i><i class="point p1"></i><i class="point p2"></i><i class="point p3"></i></div><div class="bars"><div class="barrow"><span>C/P</span><div class="bar"><i style="width:68%"></i></div><b>127 → 129</b></div><div class="barrow"><span>CARS</span><div class="bar"><i style="width:61%;background:#c98ac9"></i></div><b>125 → 127</b></div><div class="barrow"><span>B/B</span><div class="bar"><i style="width:74%;background:#6fc0a8"></i></div><b>126 → 129</b></div><div class="barrow"><span>P/S</span><div class="bar"><i style="width:70%;background:#6fb3de"></i></div><b>126 → 128</b></div></div>',ml:'Study consistency',n:'18h',mc:'logged this week across five study days',mi:[['5','day streak'],['3','FLs']],no:'<b>Stamina observation.</b><br>Across three complete FLs, the fourth section averages 2–4 points below the first. Descriptive, not predictive.',rt:'What to inspect',rg:'specific',r:rows([['!','Most-missed: units','C/P · 5 tagged misses','Review'],['◌','Mastered vs due','7 cleared · 2 drills due','M2M'],['↗','Full-length review','protect the review block after every FL','Open']])},advisor:{f:['Context','This week'],s:['Plan','Confirm before edit'],x:'View plan',p:'New conversation',e:'Advisor · permission first',t:'Talk through a change before anything in your plan moves.',z:'grounded in your data',m:'<div class="chat"><div class="bubble">You moved two sessions last week. Want to make Thursday a CARS-only block so Friday’s B/B review stays intact?</div><div class="bubble me">Why that change?</div><div class="bubble">Because two CARS blocks were skipped, while the B/B review is already due Friday. I can propose the edit; I will not apply it without your confirmation.</div></div><div class="proposal"><b>Proposed plan change</b><br>Move Thursday’s B/B content block to next Tuesday; preserve the Friday review block.<div class="chips"><button
