<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MCAT plan setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>:root{--bg:#211e1a;--card:#2b2722;--soft:#322e28;--fg:#ece3d4;--mut:#a89c8c;--dim:#7c7264;--bd:#3c352d;--mcat:#8c7bd4;--good:#6fc0a8}*{box-sizing:border-box}body{margin:0;background:#191613;color:var(--fg);font:15px/1.42 Nunito,sans-serif}.frame{width:min(1400px,100%);min-height:100vh;margin:auto;background:var(--bg);padding-bottom:42px}.ban{padding:18px 24px 0;background:radial-gradient(380px 220px at 88% 0,rgba(140,123,212,.34),transparent 70%),linear-gradient(115deg,#292847 0%,#343248 44%,#3a3730 100%)}.h1{margin:0;font:800 30px/1 'Baloo 2';color:#fff}.utabs{display:flex;gap:23px;margin-top:18px;padding:0 24px;border-bottom:1px solid rgba(255,255,255,.13);overflow:auto}.ut{white-space:nowrap;padding:10px 2px 11px;color:rgba(255,255,255,.58);font:700 14px 'Baloo 2'}.ut.on{color:#fff;border-bottom:3px solid var(--mcat)}.fbar{display:flex;align-items:center;gap:9px;padding:10px 24px;border-bottom:1px solid var(--bd);background:var(--card)}.control{padding:6px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--soft);color:var(--mut);font-size:11px;font-weight:800}.control b{font-family:'Baloo 2';color:var(--fg)}.spacer{margin-left:auto}.btn{border:0;border-radius:10px;padding:9px 13px;background:var(--mcat);color:#211a39;font:800 12px 'Baloo 2'}.btn.g{border:1px solid var(--bd);background:var(--soft);color:var(--mut)}.wrap{padding:15px 24px}.intake{max-width:980px;margin:auto}.intake-head{padding:20px 0 14px}.intake-head h2{margin:0;font:800 27px/1.05 'Baloo 2'}.intake-head p{max-width:650px;margin:6px 0 0;color:var(--mut);font-size:12px;font-weight:700}.review-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:15px}.card{border:1px solid var(--bd);border-radius:16px;background:var(--card);box-shadow:0 10px 26px -14px rgba(0,0,0,.58);overflow:hidden}.hd{display:flex;justify-content:space-between;padding:14px 16px 8px}.ti{font:800 16px 'Baloo 2'}.sub{color:var(--dim);font-size:10px;font-weight:700}.fieldgroup{padding:15px 16px;border-top:1px solid var(--bd)}.fieldgroup:first-child{border-top:0}.fieldgroup h3{margin:0;font:800 14px 'Baloo 2'}.fieldgroup p{margin:2px 0 10px;color:var(--mut);font-size:10.5px;font-weight:700}.choices{display:flex;flex-wrap:wrap;gap:7px}.choice{border:1px solid var(--bd);border-radius:9px;background:var(--soft);padding:7px 9px;color:var(--mut);font-size:10.5px;font-weight:800}.choice.on{border-color:var(--mcat);background:color-mix(in srgb,var(--mcat) 15%,var(--soft));color:#e0d9ff}.summary{display:grid;gap:8px;padding:4px 16px 16px}.summary div{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--bd);padding-top:9px;font-size:11px;font-weight:800}.summary span{color:var(--mut)}.summary b{text-align:right}.note{margin-top:15px;padding:13px;border:1px solid color-mix(in srgb,var(--good) 28%,var(--bd));border-radius:12px;background:color-mix(in srgb,var(--good) 8%,var(--soft));color:var(--mut);font-size:11px;font-weight:700}.note b{display:block;margin-bottom:2px;color:var(--fg);font-family:'Baloo 2'}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.cold{max-width:720px;margin:42px auto;padding:38px;text-align:center;border:1px dashed var(--bd);border-radius:18px}.orb{display:grid;place-items:center;width:54px;height:54px;margin:0 auto 14px;border-radius:16px;background:color-mix(in srgb,var(--mcat) 16%,var(--soft));color:#ddd4ff;font:800 24px 'Baloo 2'}.cold h2{margin:0;font:800 28px/1.05 'Baloo 2'}.cold p{max-width:500px;margin:8px auto 18px;color:var(--mut);font-size:12px;font-weight:700}.cold small{display:block;margin-top:10px;color:var(--dim);font-size:10px;font-weight:700}@media(max-width:720px){.review-grid{grid-template-columns:1fr}.wrap,.ban,.fbar{padding-left:14px;padding-right:14px}.cold{margin:20px 0;padding:30px 20px}}</style></head>
<body><main class="frame"><header class="ban"><h1 class="h1">MCAT</h1><nav class="utabs"><span class="ut">Dashboard</span><span class="ut on">Plan</span><span class="ut">Content</span><span class="ut">Questions</span><span class="ut">Mistakes</span><span class="ut">Stats</span><span class="ut">Advisor</span></nav></header><div id="state"></div></main>
<template id="review"><div class="fbar"><span class="control"><b>Plan setup</b> Review before building</span><span class="spacer"></span><button class="btn g">Edit answers</button></div><section class="wrap"><div class="intake"><div class="intake-head"><h2>Review your plan inputs</h2><p>This is what Premed OS will use to make the first schedule. Confirm it now; every part remains editable later.</p></div><div class="review-grid"><article class="card"><div class="hd"><div class="ti">Your time and test plan</div><span class="sub">student-confirmed</span></div><div class="fieldgroup"><h3>Test date</h3><p>Saturday, December 12, 2026 · 120 days away</p><div class="choices"><span class="choice on">Scheduled</span><span class="choice">Change date</span><span class="choice">I’m not scheduled</span></div></div><div class="fieldgroup"><h3>Study time</h3><p>Derived from the days you chose—not asked twice.</p><div class="choices"><span class="choice on">Mon · 2h</span><span class="choice on">Tue · 2h</span><span class="choice on">Thu · 2h</span><span class="choice on">Sat · 5h</span><span class="choice on">Sun · 4h</span></div></div><div class="fieldgroup"><h3>Known constraints</h3><p>Finals week protected · Nov 30–Dec 6. No full length scheduled there.</p><div class="choices"><span class="choice on">14h/week available</span><span class="choice">Add busy period</span></div></div><div class="fieldgroup"><h3>Starting evidence</h3><p>Diagnostic 498 · self-identified focus: C/P and CARS.</p><div class="choices"><span class="choice on">Diagnostic logged</span><span class="choice">Edit focus areas</span></div></div></article><aside><article class="card"><div class="hd"><div class="ti">Plan summary</div><span class="sub">not a prediction</span></div><div class="summary"><div><span>Target score</span><b>512</b></div><div><span>Resources</span><b>AAMC bundle · UWorld · MilesDown</b></div><div><span>Schedule shape</span><b>5 days · 14 hours/week</b></div><div><span>Full-length rhythm</span><b>Saturday + protected review</b></div></div></article><div class="note"><b>Goal, not guarantee</b>Your target guides the tradeoffs. The plan will show the time you have and what you can change; it will not claim that a score is assured.</div></aside></div><div class="actions"><button class="btn g">Save without building</button><button class="btn">Build my plan</button></div></div></section></template>
<template id="cold"><div class="fbar"><span class="control"><b>Plan</b> Not built yet</span></div><section class="wrap"><div class="cold"><div class="orb">⌁</div><h2>Build a plan around your real week</h2><p>Set a test date or say you’re unscheduled, choose the days and hours you actually have, then add your starting point. You can adjust all of it later.</p><button class="btn">Set up my plan</button><small>No projected score, schedule, or progress chart appears until you have a plan and real evidence.</small></div></section></template>
<script>const chosen=new URLSearchParams(location.search).get('state')==='cold'?'cold':'review';document.querySelector('#state').append(document.querySelector('#'+chosen).content.cloneNode(true));</script></body></html>
