<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Premed OS mockup variant lab</title>
<script>
/*

  the parent and its iframe opaque file:// origins, so switching can silently fail.
*/
if(location.protocol==="file:"){
  const supportedUrl=new URL("/variant-lab.html","http://localhost:8765");
  supportedUrl.search=location.search;
  supportedUrl.hash=location.hash;
  location.replace(supportedUrl.href);

<!--
  PROTOTYPE REVIEW LAB — never an implementation reference.

  Loads every user-facing HTML mockup without modifying the approved original.
  A = the original composition.
  B/C = page-specific structural experiments injected into the same source.
  Existing native prototypes keep their own fully-authored A/B/C variants.

  Shareable URL: ?page=<page-id>&variant=A|B|C
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#171512;--panel:#211e1a;--card:#2b2722;--muted:#322e28;--bd:#3c352d;
  --fg:#ece3d4;--mut:#a89c8c;--dim:#7c7264;--cat:#4b9cd3;--ok:#6fc0a8;
  --warn:#e7b06a;--legacy:#c98ac9;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Nunito',system-ui,sans-serif;overflow:hidden}
button{font:inherit}
.lab{height:100%;display:grid;grid-template-columns:270px minmax(0,1fr)}
.side{background:var(--panel);border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
.brand{padding:17px 17px 14px;border-bottom:1px solid var(--bd)}
.brand h1{font-family:'Baloo 2';font-size:19px;line-height:1;margin:0;font-weight:800}
.brand p{font-size:10.5px;color:var(--dim);font-weight:700;margin:5px 0 0}
.progress{margin-top:11px;height:5px;background:#141210;border-radius:999px;overflow:hidden}
.progress i{height:100%;display:block;background:var(--cat);width:100%;box-shadow:0 0 10px color-mix(in srgb,var(--cat) 55%,transparent)}
.nav{padding:10px;overflow:auto;display:flex;flex-direction:column;gap:3px}
.group{font-family:'Baloo 2';font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:800;padding:10px 8px 4px}
.subgroup{font-family:'Baloo 2';font-size:9px;color:#c4b9aa;font-weight:800;padding:7px 8px 2px 17px}
.pagebtn{width:100%;border:1px solid transparent;background:transparent;color:var(--mut);border-radius:9px;padding:8px 9px;
  display:grid;grid-template-columns:1fr auto;gap:7px;text-align:left;cursor:pointer}
.pagebtn.depth1{padding-left:18px}.pagebtn.depth2{padding-left:29px}
.pagebtn:hover{background:var(--muted);color:var(--fg)}
.pagebtn.on{background:color-mix(in srgb,var(--cat) 12%,var(--muted));border-color:color-mix(in srgb,var(--cat) 35%,var(--bd));color:var(--fg)}
.pname{display:block;font-family:'Baloo 2';font-size:11.5px;font-weight:800;line-height:1.2}
.pmeta{display:block;font-size:8.5px;color:var(--dim);font-weight:700;margin-top:2px}
.status{align-self:center;font-family:'Baloo 2';font-size:7.5px;font-weight:800;border-radius:999px;padding:2px 6px;
  background:#171512;color:var(--dim);text-transform:uppercase}
.status.approved{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
/* BUILT — the stage past approved: this drawing now exists in the app.
   Filled rather than tinted, because it is terminal. An approved mockup is a
   pending decision; a built one is a reference you check the app against. */
.status.built{color:var(--bg);background:var(--ok);font-weight:900}
.status.proposed{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.status.legacy{color:var(--legacy);background:color-mix(in srgb,var(--legacy) 12%,transparent)}
.status.native{color:var(--cat);background:color-mix(in srgb,var(--cat) 12%,transparent)}
.status.soon{color:var(--dim);background:#171512}
.status.draft{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}

.main{min-width:0;display:grid;grid-template-rows:auto auto minmax(0,1fr);background:#11100e}
.top{grid-row:1;background:var(--panel);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;align-items:center;gap:12px;min-width:0}
.arrow{width:31px;height:31px;border:1px solid var(--bd);background:var(--muted);color:var(--fg);border-radius:9px;display:grid;place-items:center;cursor:pointer}
.arrow svg{width:14px;height:14px}.arrow:disabled{opacity:.35}
.title{min-width:0;flex:1}.title h2{font-family:'Baloo 2';font-weight:800;font-size:15px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title p{font-size:9.5px;color:var(--dim);font-weight:700;margin:1px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.original{font-family:'Baloo 2';font-size:10.5px;font-weight:800;color:var(--cat);text-decoration:none;border:1px solid var(--bd);
  border-radius:8px;padding:6px 9px;background:var(--muted)}
.fullscreen-toggle{height:31px;border:1px solid var(--bd);background:var(--muted);color:var(--fg);border-radius:9px;padding:0 10px;
  display:flex;align-items:center;gap:6px;cursor:pointer;font-family:'Baloo 2';font-size:10.5px;font-weight:800;white-space:nowrap}
.fullscreen-toggle svg{width:14px;height:14px}
.viewbar{grid-row:2;display:none;align-items:center;gap:10px;padding:8px 14px;background:#181613;border-bottom:1px solid var(--bd);min-width:0}
.viewbar.on{display:flex}
.viewbar-label{font-family:'Baloo 2';font-size:9px;font-weight:800;color:var(--dim);letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.view-options{display:flex;align-items:center;gap:5px;min-width:0;overflow:auto}
.view-option{border:1px solid var(--bd);border-radius:8px;background:#211e1a;color:var(--mut);padding:5px 10px;
  font-family:'Baloo 2';font-size:10.5px;font-weight:800;white-space:nowrap;cursor:pointer}
.view-option:hover{color:var(--fg);background:var(--muted)}
.view-option.on{color:#101820;background:var(--cat);border-color:var(--cat)}
.stage{grid-row:3;position:relative;min-height:0;padding:12px 12px 76px}
.viewport{width:100%;height:100%;border:1px solid var(--bd);border-radius:14px;background:#1a1714;overflow:hidden;
  box-shadow:0 18px 50px rgba(0,0,0,.38)}
iframe{width:100%;height:100%;border:0;background:#1a1714}
.placeholder-view{width:100%;height:100%;display:none;align-items:center;justify-content:center;padding:40px;background:
  radial-gradient(circle at 70% 18%,rgba(75,156,211,.12),transparent 34%),#1a1714}
.placeholder-view.on{display:flex}
.placeholder-card{width:min(760px,100%);border:1px solid #3c352d;border-radius:22px;background:#24201b;padding:34px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.placeholder-crumb{font-size:10px;color:#8f8475;font-weight:800;text-transform:uppercase;letter-spacing:.1em}
.placeholder-card h3{font-family:'Baloo 2';font-size:34px;line-height:1.04;margin:12px 0 8px}
.placeholder-card p{color:#b5aa9a;font-size:14px;line-height:1.6;margin:0;max-width:600px}
.placeholder-pill{display:inline-flex;margin-top:22px;border-radius:999px;padding:7px 11px;background:rgba(75,156,211,.12);color:#7fc1e9;
  font-family:'Baloo 2';font-size:11px;font-weight:800}
/* Not-yet-drawn tabs still carry three named design directions so the bottom
   A/B/C switcher is present everywhere WITHOUT faking a mockup. The dashed
   border and the "not yet drawn" pill are the honesty signal — never remove
   them from a direction that has no source HTML behind it. */
.placeholder-direction{margin-top:24px;border:1px dashed #4a4238;border-radius:14px;background:#1e1a16;padding:16px 18px}
.pd-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.pd-letter{font-family:'Baloo 2';font-size:11px;font-weight:800;color:#101820;background:var(--cat);border-radius:999px;padding:2px 9px}
.pd-name{font-family:'Baloo 2';font-size:16px;font-weight:800;color:var(--fg)}
.pd-status{font-family:'Baloo 2';font-size:9px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#c9a05e;
  background:rgba(231,176,106,.13);border-radius:999px;padding:3px 8px}
.pd-desc{margin:9px 0 0;color:#a1968a;font-size:12.5px;line-height:1.55;max-width:620px}
.loading{position:absolute;inset:12px 12px 76px;display:grid;place-items:center;color:var(--dim);font-family:'Baloo 2';font-weight:800;pointer-events:none}
.loading.hide{display:none}

.switcher{position:absolute;left:50%;bottom:17px;transform:translateX(-50%);display:flex;align-items:center;gap:7px;padding:6px;
  background:#f7f3ec;color:#211e1a;border-radius:999px;box-shadow:0 15px 38px rgba(0,0,0,.5);z-index:4}
.switcher button{width:34px;height:34px;border:0;border-radius:50%;background:#27231f;color:#fff;display:grid;place-items:center;cursor:pointer}
.switcher button svg{width:14px;height:14px}
.switcher.off{display:none}
.lab.fullscreen{grid-template-columns:1fr}
.lab.fullscreen .side{display:none}
.lab.fullscreen .main{grid-template-rows:minmax(0,1fr)}
.lab.fullscreen .top{position:fixed;right:12px;top:12px;z-index:20;background:transparent;border:0;padding:0;pointer-events:none}
.lab.fullscreen .top>*:not(.fullscreen-toggle){display:none}
.lab.fullscreen .fullscreen-toggle{pointer-events:auto;background:rgba(33,30,26,.92);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.lab.fullscreen .stage{grid-row:1;padding:0}
.lab.fullscreen .viewbar{position:fixed;left:12px;top:12px;z-index:20;border:1px solid var(--bd);border-radius:10px;
  background:rgba(24,22,19,.94);box-shadow:0 10px 30px rgba(0,0,0,.45);max-width:calc(100vw - 190px)}
.lab.fullscreen .viewport{border:0;border-radius:0}
.lab.fullscreen .loading{inset:0}
/* The A/B/C switcher stays available in full screen too — comparing layouts at
   realistic width is exactly when you need it. It floats and fades back until
   hovered so it never competes with the mockup. */
.lab.fullscreen .switcher{bottom:14px;opacity:.34;transition:opacity .16s ease}
.lab.fullscreen .switcher:hover,.lab.fullscreen .switcher:focus-within{opacity:1}
.lab.fullscreen .switcher{display:none}
.vtext{width:300px;text-align:center;line-height:1.1}.vtext b{font-family:'Baloo 2';font-size:12.5px;font-weight:800}
.vtext span{display:block;font-size:8.5px;color:#776f65;font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button:focus-visible,a:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(max-width:780px){
  .lab{grid-template-columns:1fr}.side{display:none}.top{padding:8px}.stage{padding:7px 7px 72px}.loading{inset:7px 7px 72px}
  .vtext{width:230px}.original{display:none}
}
</style>
</head>
<body>
<div class="lab">
  <aside class="side">
    <div class="brand">
      <h1>Mockup variant lab</h1>
      <p>Product order · completed work gets A / B / C</p>
      <div class="progress"><i></i></div>
    </div>
    <nav class="nav" id="page-nav" aria-label="Mockup pages"></nav>
  </aside>

  <main class="main">
    <header class="top">
      <button class="arrow" id="prev-page" aria-label="Previous page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m15 18-6-6 6-6"/></svg></button>
      <button class="arrow" id="next-page" aria-label="Next page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m9 18 6-6-6-6"/></svg></button>
      <div class="title"><h2 id="page-title"></h2><p id="page-description"></p></div>
      <a class="original" id="original-link" target="_blank">Open untouched original ↗</a>
      <button class="fullscreen-toggle" id="fullscreen-toggle" aria-pressed="false" aria-label="Enter full screen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
        <span>Full screen</span>
      </button>
    </header>
    <div class="viewbar" id="viewbar" aria-label="Product view selector">
      <span class="viewbar-label" id="viewbar-label">View</span>
      <div class="view-options" id="view-options"></div>
    </div>
    <section class="stage">
      <div class="viewport">
        <iframe id="preview" title="Selected mockup variant"></iframe>
        <div class="placeholder-view" id="placeholder-view">
          <article class="placeholder-card">
            <div class="placeholder-crumb" id="placeholder-crumb"></div>
            <h3 id="placeholder-title"></h3>
            <p id="placeholder-copy"></p>
            <span class="placeholder-pill">Mockup coming soon</span>
            <div class="placeholder-direction" id="placeholder-direction">
              <div class="pd-head">
                <span class="pd-letter" id="pd-letter">A</span>
                <span class="pd-name" id="pd-name"></span>
                <span class="pd-status">Direction only · not yet drawn</span>
              </div>
              <p class="pd-desc" id="pd-desc"></p>
            </div>
          </article>
        </div>
      </div>
      <div class="loading" id="loading">Loading mockup…</div>
      <div class="switcher" id="variant-switcher" aria-label="Variant switcher">
        <button id="prev-variant" aria-label="Previous variant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m15 18-6-6 6-6"/></svg></button>
        <div class="vtext"><b id="variant-title"></b><span id="variant-description"></span></div>
        <button id="next-variant" aria-label="Next variant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
    </section>
  </main>
</div>

    const join=page.path.includes("?") ? "&" : "?";
    const view=page.variantViews[currentKey()] || page.variantViews.A;
    return `${page.path}${join}view=${encodeURIComponent(view)}&lab-rev=${encodeURIComponent(page.variantSourceRev || "current")}`;
  }
  if(page.passViewToSource && currentView()){
    const join=page.path.includes("?") ? "&" : "?";
    return `${page.path}${join}view=${encodeURIComponent(currentView().slug)}`;
  }
  return page.path;
}
function loadOrApply(force){
  const page=current();
  if(page.placeholder){
    preview.style.display="none";
    placeholderView.classList.add("on");
    document.getElementById("placeholder-crumb").textContent=page.group + (page.section ? ` · ${page.section}` : "");
    document.getElementById("placeholder-title").textContent=page.name;
    document.getElementById("placeholder-copy").textContent=page.desc;
    /* Reflect the selected A/B/C direction without implying a drawn mockup. */
    const direction=currentVariantSet().variants?.[variantIndex];
    const block=document.getElementById("placeholder-direction");
    block.hidden=!direction;
    if(direction){
      document.getElementById("pd-letter").textContent=currentKey();
      document.getElementById("pd-name").textContent=direction[0];
      document.getElementById("pd-desc").textContent=direction[1];
    }
    loading.classList.add("hide");
    return;
  }
  preview.style.display="block";
  placeholderView.classList.remove("on");
  const next=desiredSrc();
  const currentPath=preview.getAttribute("src") || "";
  const mustReload=force || current().native || currentPath!==next;
  if(mustReload){
    loading.classList.remove("hide");
    preview.src=next;
  }else applyVariant();
}
function renderAll(force){
  renderNav(); renderViewbar(); renderMeta(); loadOrApply(force);
}
function refreshCanvasFit(){
  if(current().placeholder) return;
  requestAnimationFrame(()=>applyVariant());
}
function setFullscreen(enabled){
  lab.classList.toggle("fullscreen",enabled);
  fullscreenToggle.setAttribute("aria-pressed",String(enabled));
  fullscreenToggle.setAttribute("aria-label",enabled ? "Exit full screen" : "Enter full screen");
  fullscreenToggle.querySelector("span").textContent=enabled ? "Exit full screen" : "Full screen";
  refreshCanvasFit();
}
preview.addEventListener("load",applyVariant);
document.getElementById("prev-page").addEventListener("click",()=>cyclePage(-1));
document.getElementById("next-page").addEventListener("click",()=>cyclePage(1));
document.getElementById("prev-variant").addEventListener("click",()=>cycleVariant(-1));
document.getElementById("next-variant").addEventListener("click",()=>cycleVariant(1));
fullscreenToggle.addEventListener("click",()=>setFullscreen(!lab.classList.contains("fullscreen")));
addEventListener("keydown",event=>{
  const tag=document.activeElement?.tagName;
  if(tag==="INPUT"||tag==="TEXTAREA"||document.activeElement?.isContentEditable)return;
  if(event.key==="Escape" && lab.classList.contains("fullscreen")){ setFullscreen(false); return; }
  if(event.key==="ArrowLeft")cycleVariant(-1);
  if(event.key==="ArrowRight")cycleVariant(1);
  if(event.key==="ArrowUp")cyclePage(-1);
  if(event.key==="ArrowDown")cyclePage(1);
});
addEventListener("popstate",()=>{
  const next=new URLSearchParams(location.search);
  pageIndex=Math.max(0,profiles.findIndex(p=>p.id===next.get("page")));
  viewIndex=Math.max(0,(profiles[pageIndex].views || []).findIndex(view => view.slug === next.get("view")));
  variantIndex=Math.max(0,variants.indexOf((next.get("variant")||"A").toUpperCase()));
  variantIndex=Math.min(variantIndex,Math.max(0,currentKeys().length-1));
  renderAll(true);
});
renderAll(true);
</script>
</body>
